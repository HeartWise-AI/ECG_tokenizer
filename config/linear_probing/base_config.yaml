# pipeline project
pipeline_project: !!str "ECG_Tokenizer_Linear_Probing"
model_name: !!str "ECG_Tokenizer_Wrapper"
runner_name: !!str "ECG_Tokenizer_Linear_Probing_Runner"
run_mode: !!str "train"
num_epochs: !!int 10
seed: !!int 42
base_checkpoint_path: !!str "/volume/ECG_tokenizer/paper/experiments/linear_probing/outputs/"
pretrained_tokenizer_path: !!str "/volume/ECG_tokenizer/checkpoints/ECG_tokenizer_latest/best_model_epoch_10.pt"
inference_dataset_path: !!str "/media/data1/datasets/ECG_Tokenizer/parquets/test/mimic_mhi_psa_test_updated.parquet"
inference_checkpoint_path: !!str ""
# wandb parameters
wandb_project: !!str "ECG_Tokenizer_Linear_Probing"
wandb_entity: !!str "mhi_ai"
use_wandb: !!bool true
# training parameters
lr: !!float 3e-4
scheduler_type: !!str "cosine_warm_restart"
lr_step_period: !!int 1
factor: !!float 0.3
optimizer: !!str "AdamW"
weight_decay: !!float 1e-4
step_size: !!int 1
gamma: !!float 0.1
num_warmup_percent: !!float 0.1
num_hard_restarts_cycles: !!float 0.5
warm_restart_tmult: !!int 2
# VQVAE parameters
decoder_mode: !!str "classification"
decoder_name: !!str "Linear_Classifier_Decoder"
# Classification parameters
num_classes: !!int 77
criterion: !!str "bce_loss"
# Dataset parameters
train_dataset_path: !!str "/media/data1/datasets/ECG_Tokenizer/parquets/train/mimic_mhi_psa_train_updated.parquet"
validation_dataset_path: !!str "/media/data1/datasets/ECG_Tokenizer/parquets/test/mimic_mhi_psa_test_updated.parquet"
num_workers: !!int 32
batch_size: !!int 12
signal_path_column: !!str "waveform_path_psa" # PSA-normalized npy paths; loader default
# waveform parameters

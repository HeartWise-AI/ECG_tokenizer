# Phase 2 RLVR — multilabel labelset verifier on 5M-row interpretation parquet.
# Init from 2wjwbk0b_ENHANCED. Single-GPU.

pipeline_project: "ECG_Tokenizer_GRPO_Finetuning"
runner_name: "ECG_Tokenizer_GRPO_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
run_mode: "train"
wandb_project: "ECG_tokenizer_RLVR"
wandb_entity: "mhi_ai"
use_wandb: true
# Init from SFT
pretrained_tokenizer_path: "/volume/ECG_tokenizer/checkpoints/BEST_LLM/2wjwbk0b_20260413-224103_ENHANCED/best_model.pt"
# Dataset: 5M-row weighted parquet (7.27M rows total, filtered to diagnostic cats)
train_dataset_path: "/volume/ECG_tokenizer/output/combined_train_qa_m5000k_h5000k_weighted.parquet"
signal_path_column: "waveform_path_psa"
prompt_column: "prompt"
answer_column: "generated_answer"
filter_prompt_categories:
  - "interpretation"
  - "classification"
  - "json_interpretation"
  - "category_rhythm"
  - "category_conduction"
  - "category_infarct_ischemia"
  - "category_chamber_enlargement"
  - "category_other"
  - "structural_heart_disease"
max_train_rows: 5000 # Small set — fast iteration; judge is the slow part
# Verifier: ontology-based multilabel F1 on canonical labels in GT text vs model output
verifier: "judge"
ontology_path: "/volume/LLM_JUDGE/ontology/ecg_ontology.json"
# GRPO hyperparameters (stable settings from prior runs)
group_size: 4
epsilon_low: 0.2
epsilon_high: 0.3
beta: 0.1 # 10× stronger KL — prevent the catastrophic drift seen in Phase 2 labelset
# Reward weights (drop r_evidence — interpretation prompts don't need explicit CoT)
reward_weights:
  format: 0.1
  diagnosis: 0.9
# Generation — longer for diagnostic answers
temperature: 1.0
top_p: 0.95
max_new_tokens: 256
# Training
num_epochs: 1
batch_size: 2
lr: 1.0e-6
num_workers: 4
grad_accum_steps: 4
max_grad_norm: 0.5
precision: "bf16"
save_interval: 10 # Optimizer steps; save every 40 batches
log_interval: 10
trainable: "lora"
medgemma_prompt_style: true
base_checkpoint_path: "checkpoints/RLVR"

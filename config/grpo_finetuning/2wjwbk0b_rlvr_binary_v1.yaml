# Phase 1 RLVR warm-up: binary Yes/No diagnosis QA with direct GT verifier.
# Init from 2wjwbk0b_ENHANCED (SFT'd MedGemma-4B-IT + LoRA on 3-dataset mix).
# 2 GPUs (2,3), ~188k rows, max_new_tokens=32, group_size=4.

pipeline_project: "ECG_Tokenizer_GRPO_Finetuning"
runner_name: "ECG_Tokenizer_GRPO_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
run_mode: "train"
wandb_project: "ECG_tokenizer_RLVR"
wandb_entity: "mhi_ai"
use_wandb: true
# Init from latest SFT checkpoint
pretrained_tokenizer_path: "/volume/ECG_tokenizer/checkpoints/BEST_LLM/2wjwbk0b_20260413-224103_ENHANCED/best_model.pt"
# Dataset: binary Yes/No diagnosis QA
train_dataset_path: "/volume/ECG_tokenizer/output/binary_diagnosis_qa_train.parquet"
signal_path_column: "waveform_path_psa"
prompt_column: "prompt"
answer_column: "generated_answer"
filter_prompt_categories: ["binary_diagnosis"]
# Verifier: direct first-word match against GT (no BERT classifier)
verifier: "binary"
# GRPO hyperparameters (inherited from existing stable run)
group_size: 4
epsilon_low: 0.2
epsilon_high: 0.3
beta: 0.01 # KL — must stay > 0 (see memory: beta=0 → collapse by step 1200)
# Reward weights (drop r_evidence for Phase 1 — no CoT)
reward_weights:
  format: 0.1
  diagnosis: 0.9
# Generation — short (Yes/No only)
temperature: 1.0
top_p: 0.95
max_new_tokens: 32
# Training
num_epochs: 1
batch_size: 2
lr: 2.0e-6
num_workers: 4
grad_accum_steps: 4
max_grad_norm: 0.5
precision: "bf16"
save_interval: 500
log_interval: 10
trainable: "lora"
medgemma_prompt_style: true
base_checkpoint_path: "checkpoints/RLVR"

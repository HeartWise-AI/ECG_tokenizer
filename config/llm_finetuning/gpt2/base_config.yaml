# pipeline project
pipeline_project: !!str "ECG_Tokenizer_LLM_Finetuning"
model_name: !!str "ECG_Tokenizer_Wrapper"
runner_name: !!str "ECG_Tokenizer_LLM_Finetuning"
run_mode: !!str "validate"
num_epochs: !!int 10
seed: !!int 42
base_checkpoint_path: !!str "checkpoints"
# pretrained_tokenizer_path: !!str "checkpoints/ECG_Tokenizer_Training/ECG_Tokenizer_Classification/6l7oogin_20250608-111318/best_model_epoch_7.pt"
# pretrained_tokenizer_path: !!str "checkpoints/ECG_Tokenizer_Training/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
pretrained_tokenizer_path: !!str "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
# wandb parameters
wandb_project: !!str "ECG_Tokenizer_LLM_Finetuning"
wandb_entity: !!str "mhi_ai"
use_wandb: !!bool false
# training parameters
llm_lr: !!float 5e-5
adapter_lr: !!float 5e-4
llm_weight_decay: !!float 1e-2
adapter_weight_decay: !!float 1e-4
scheduler_type: !!str "cosine"
lr_step_period: !!int 1
factor: !!float 0.3
optimizer: !!str "AdamW"
step_size: !!int 1
gamma: !!float 0.1
num_warmup_percent: !!float 0.1
num_hard_restarts_cycles: !!float 0.5
warm_restart_tmult: !!int 2
# VQVAE parameters
decoder_mode: !!str "llm"
decoder_name: !!str "GPT2_Decoder"
# LLM tokenizer parameters
tokenizer_name: !!str "gpt2"
max_token_length: !!int 512
# LLM model parameters
huggingface_model_name: !!str "gpt2"
bridge_name: !!str "GPT2_SequenceBridge"
llm_input_embedding_size: !!int 768
# Dataset parameters
train_dataset_path: !!str "/volume/ECG_tokenizer/output/MHI/mimic_mhi_psa_train_updated.parquet"
validation_dataset_path: !!str "/volume/ECG_tokenizer/output/MHI/mimic_mhi_psa_test_updated_stratified_20%.parquet"
num_workers: !!int 12
batch_size: !!int 16
signal_path_column: !!str "waveform_path_psa" # waveform_path_psa or waveform_path_original
# ECG parameters
ecg_waveform_length: !!int 2500
ecg_num_leads: !!int 12
# metrics
metrics:
  - !!str "rouge"
  - !!str "bleu"
  - !!str "meteor"

# Codebook selection (REQUIRED - prevents silent stage1 loading failures)
num_codebooks_kept: 8  # Use all 8 codebooks
codebook_offset: 0     # Start from first codebook

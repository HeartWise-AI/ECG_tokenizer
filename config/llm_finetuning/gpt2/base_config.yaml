# pipeline project
pipeline_project: !!str "ECG_tokenizer_LLM_finetuning"
runner_name: !!str "LLM_finetuning_runner"
run_mode: !!str "train"
num_epochs: !!int 1
seed: !!int 42
base_checkpoint_path: !!str "checkpoints"
# wandb parameters
wandb_project: !!str "ECG_tokenizer_LLM_finetuning_MHI"
wandb_entity: !!str "mhi_ai"
use_wandb: !!bool false
# training parameters
num_workers: !!int 12
llm_lr: !!float 5e-5
llm_weight_decay: !!float 1e-4
embedding_adapter_lr: !!float 5e-5
embedding_adapter_weight_decay: !!float 1e-4
embedding_adapter_dropout: !!float 0.2
batch_size: !!int 4
criterion: !!str "focal_loss"
optimizer: !!str "AdamW"
scheduler_type: !!str "cosine_warm_restart"
step_size: !!int 1
gamma: !!float 0.1
num_warmup_percent: !!float 0.1
num_hard_restarts_cycles: !!float 1.0
warm_restart_tmult: !!int 2
# LLM tokenizer parameters
tokenizer_name: !!str "gpt2"
max_token_length: !!int 512
# LLM model parameters
huggingface_model_name: !!str "gpt2"
trainable_model_name: !!str "GPT2_Tokenizer_Wrapper"
embedding_adapter_name: !!str "GPT2_LinearReducer"
gpt2_embedding_size: !!int 768
# ECG tokenizer parameters
ecg_tokenizer_path: !!str "/media/data1/models/ECG_Tokenizer/kaxjz4j2_20250429-194002/best_model_epoch_7.pt"
ecg_tokenizer_num_quantizers: !!int 12
ecg_tokenizer_codebook_size: !!int 1024
ecg_encoder_name: !!str "Conv_Encoder"
ecg_quantizer_name: !!str "ECG_Tokenizer_Quantizer"
ecg_decoder_name: !!str "Conv_Decoder"
ecg_embedding_size: [12, 128, 82]
# Dataset parameters
train_dataset_path: !!str "/media/data1/datasets/ECG_Tokenizer/parquets/train/mimic_mhi_psa_train_updated.parquet"
validation_dataset_path: !!str "/media/data1/datasets/ECG_Tokenizer/parquets/test/mimic_mhi_psa_test_updated.parquet"
# ECG parameters
ecg_waveform_length: !!int 2500
ecg_num_leads: !!int 12
# metrics
metrics:
  - !!str "rouge"
  - !!str "bleu"
  - !!str "meteor"
# Inference parameters
checkpoint_dir: !!str "checkpoints/gpt2/mimic_mhi/best_model.pt"
inference_dataset_path: !!str "parquets/mhi/test_trial_v1.1_with_report.parquet"

# pipeline project
pipeline_project: !!str "ECG_Tokenizer_LLM_Finetuning"
model_name: !!str "ECG_Tokenizer_Wrapper"
runner_name: !!str "ECG_Tokenizer_LLM_Finetuning"
run_mode: !!str "train"
num_epochs: !!int 10
seed: !!int 42
base_checkpoint_path: !!str "checkpoints"
pretrained_tokenizer_path: !!str "/volume/ECG_tokenizer/checkpoints/ECG_tokenizer_latest/best_model_epoch_10.pt"
# pretrained_tokenizer_path: !!str "checkpoints/ECG_Tokenizer_LLM_Finetuning/ECG_tokenizer_LLM_finetuning_MHI/1i4yuhql_20250615-172705/checkpoint_epoch_10.pt"
# wandb parameters
wandb_project: !!str "ECG_tokenizer_LLM_finetuning_Llama32_3B"
wandb_entity: !!str "mhi_ai"
use_wandb: !!bool true
# training parameters
llm_lr: !!float 6e-6
adapter_lr: !!float 4e-5
llm_weight_decay: !!float 1e-2
adapter_weight_decay: !!float 1e-4
scheduler_type: !!str "cosine_warm_restart"
lr_step_period: !!int 1
factor: !!float 0.3
optimizer: !!str "AdamW"
step_size: !!int 1
gamma: !!float 0.1
num_warmup_percent: !!float 0.1
num_hard_restarts_cycles: !!float 1.0
warm_restart_tmult: !!int 2
# VQVAE parameters
decoder_mode: !!str "llm"
decoder_name: !!str "Llama32_Decoder"
# LLM tokenizer parameters
tokenizer_name: !!str "meta-llama/Llama-3.2-3B"
max_token_length: !!int 256
# LLM model parameters
huggingface_model_name: !!str "meta-llama/Llama-3.2-3B"
bridge_name: !!str "Llama32_SequenceBridge"
llm_input_embedding_size: !!int 3072
# Dataset parameters
train_dataset_path: !!str "/volume/ECG_tokenizer/output/MHI/mimic_mhi_psa_train_updated_stratified_20%.parquet"
validation_dataset_path: !!str "/volume/ECG_tokenizer/output/MHI/mimic_mhi_psa_test_updated_stratified_20%.parquet"
num_workers: !!int 12
batch_size: !!int 16
signal_path_column: !!str "waveform_path_psa" # waveform_path_psa or waveform_path_original
# ECG parameters
ecg_waveform_length: !!int 2500
ecg_num_leads: !!int 12
# metrics
metrics:
  - !!str "rouge"
  - !!str "bleu"
  - !!str "meteor"

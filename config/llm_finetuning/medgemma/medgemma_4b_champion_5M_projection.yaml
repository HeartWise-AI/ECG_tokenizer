# MedGemma champion configuration (5M) using ECGProjectionBridge with sinusoidal positions.

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "train"
num_epochs: 1
seed: 42

# Training phases configuration
training_phases:
  phase1_alignment:
    epochs: 1
    freeze_llm: true
    use_lora: true
    llm_lr: 5.0e-5
    ecg_embedding_lr: 0.0
    adapter_lr: 5.0e-4
    warmup_steps: 0
    debug_config:
      log_gradient_norms: true

debug_config:
  log_gradient_norms: true
  show_sample_outputs: false
  log_frequency: 200

base_checkpoint_path: "checkpoints"
pretrained_tokenizer_path: !!str "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"

wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
use_wandb: true

# Optimizer & scheduler
llm_lr: 5.0e-5
adapter_lr: 5.0e-4
llm_weight_decay: 1.0e-5
adapter_weight_decay: 1.0e-5
# Use cosine decay without warmup
scheduler_type: "cosine"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.0
num_hard_restarts_cycles: 0.5
warm_restart_tmult: 2

# Decoder & tokenizer
decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
tokenizer_name: "google/medgemma-4b-it"
use_auto_processor: false
max_token_length: 640
num_ecg_tokens: 128
instruct_mode: true
prefix_tuning: false
huggingface_model_name: "google/medgemma-4b-it"

# Bridge configuration (Projection bridge)
bridge_name: "ECGProjectionBridge"
llm_input_embedding_size: 2560
# Ensure bridge token count matches num_ecg_tokens to keep masks aligned
bridge_num_visual_tokens: 128
# Positional encoding flexibility for projection
bridge_use_sinusoidal_pos_emb: true
bridge_pos_embedding_max_len: 4096

# Codebook/quantizer fields kept for compatibility (unused by projection)
num_codebooks_kept: 8
codebook_offset: -1
num_quantizers: 8
ecg_codebook_size: 512

# LoRA configuration
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_top_k_layers: 16
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_bias: "none"

# Dataset paths (5M train / 25k validation)
train_dataset_path: "/volume/ECG_tokenizer/output/combined_train_qa_m5000k_h5000k.parquet"
validation_dataset_path: "/volume/ECG_tokenizer/output/combined_test_qa_m25k_h25k.parquet"
prompt_column: "prompt"
answer_column: "generated_answer"
category_column: "prompt_category"

# Pattern classification columns (77 ECG patterns from utils/constants.py)
pattern_label_columns:
  - "Sinusal"
  - "Regular"
  - "Monomorph"
  - "QS complex in V1-V2-V3"
  - "R complex in V5-V6"
  - "T wave inversion (inferior - II, III, aVF)"
  - "Left bundle branch block"
  - "RaVL > 11 mm"
  - "SV1 + RV5 or RV6 > 35 mm"
  - "T wave inversion (lateral -I, aVL, V5-V6)"
  - "T wave inversion (anterior - V3-V4)"
  - "Left axis deviation"
  - "Left ventricular hypertrophy"
  - "Bradycardia"
  - "Q wave (inferior - II, III, aVF)"
  - "Afib"
  - "Irregularly irregular"
  - "Atrial tachycardia (>= 100 BPM)"
  - "Nonspecific intraventricular conduction delay"
  - "Premature ventricular complex"
  - "Polymorph"
  - "T wave inversion (septal- V1-V2)"
  - "Right bundle branch block"
  - "Ventricular paced"
  - "ST elevation (anterior - V3-V4)"
  - "ST elevation (septal - V1-V2)"
  - "1st degree AV block"
  - "Premature atrial complex"
  - "Atrial flutter"
  - "rSR' in V1-V2"
  - "qRS in V5-V6-I, aVL"
  - "Left anterior fascicular block"
  - "Right axis deviation"
  - "2nd degree AV block - mobitz 1"
  - "ST depression (inferior - II, III, aVF)"
  - "Acute pericarditis"
  - "ST elevation (inferior - II, III, aVF)"
  - "Low voltage"
  - "Regularly irregular"
  - "Junctional rhythm"
  - "Left atrial enlargement"
  - "ST elevation (lateral - I, aVL, V5-V6)"
  - "Atrial paced"
  - "Right ventricular hypertrophy"
  - "Delta wave"
  - "Wolff-Parkinson-White (Pre-excitation syndrome)"
  - "Prolonged QT"
  - "ST depression (anterior - V3-V4)"
  - "QRS complex negative in III"
  - "Q wave (lateral- I, aVL, V5-V6)"
  - "Supraventricular tachycardia"
  - "ST downslopping"
  - "ST depression (lateral - I, avL, V5-V6)"
  - "2nd degree AV block - mobitz 2"
  - "U wave"
  - "R/S ratio in V1-V2 >1"
  - "RV1 + SV6 > 11 mm"
  - "Left posterior fascicular block"
  - "Right atrial enlargement"
  - "ST depression (septal- V1-V2)"
  - "Q wave (septal- V1-V2)"
  - "Q wave (anterior - V3-V4)"
  - "ST upslopping"
  - "Right superior axis"
  - "Ventricular tachycardia"
  - "ST elevation (posterior - V7-V8-V9)"
  - "Ectopic atrial rhythm (< 100 BPM)"
  - "Lead misplacement"
  - "Third Degree AV Block"
  - "Acute MI"
  - "Early repolarization"
  - "Q wave (posterior - V7-V9)"
  - "Bi-atrial enlargement"
  - "LV pacing"
  - "Brugada"
  - "Ventricular Rhythm"
  - "no_qrs"

num_workers: 24
batch_size: 16
signal_path_column: "waveform_path_psa"
ecg_waveform_length: 2500
ecg_num_leads: 12

# Metrics
metrics:
  - "rouge"
  - "bleu"
  - "meteor"
  - "bertscore"
  - "json_parse_rate"
  - "structured_f1"
# Compute BERTScore on up to 10 batches by default
bertscore_max_batches: 10
compute_category_metrics: true
category_metrics:
  - "rouge"
  - "bleu"
  - "meteor"

pattern_loss_weight: 0.0
pattern_bce_pos_weight: 2.0

# Training optimizations
gradient_accumulation_steps: 16
dataloader_pin_memory: true
max_sequence_length: 768

# Mid-epoch validation & train snapshots
validation_step_interval: 10000
validation_snapshot_batches: 256
validation_snapshot_prefix: "step"
validation_subset_size: 2000
validation_balance_prompt_categories: true
validation_sampling_seed: 42
train_metric_interval: 1000
train_metric_batches: 4

# Visualization
enable_attention_visualization: false
attention_log_frequency: 1000
plot_validation_ecgs: true
num_validation_plots: 6
plot_selection_strategy: "worst_random_best"

# Generation parameters (deterministic defaults; router may override)
default_generation_kwargs:
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  no_repeat_ngram_size: 5
  max_new_tokens: 96
  min_new_tokens: 0
  repetition_penalty: 1.10
  force_json: false
  min_tokens_guard: 12

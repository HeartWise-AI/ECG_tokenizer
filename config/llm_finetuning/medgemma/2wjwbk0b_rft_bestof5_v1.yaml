# RFT (rejection-sampling fine-tune) on best-of-5 wins from 2wjwbk0b_ENHANCED.
# Goal: distill the best-of-5 ceiling into the weights so greedy decode catches it.
# Resumes from the 2wjwbk0b SFT checkpoint, trains 2 epochs on 573 judge-validated rows.

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "train"
num_epochs: 2
seed: 42

# Resume from the 2wjwbk0b SFT model — this is the checkpoint best-of-5 was run from
pretrained_tokenizer_path: !!str "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
resume_checkpoint_path: !!str "/volume/ECG_tokenizer/checkpoints/BEST_LLM/2wjwbk0b_20260413-224103_ENHANCED/best_model.pt"
base_checkpoint_path: "checkpoints"

# W&B
wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
use_wandb: false

# Phase: single training phase, LoRA-only — same as SFT, just sharper
training_phases:
  phase1_alignment:
    epochs: 2
    freeze_llm: true
    use_lora: true
    llm_lr: 1.0e-5    # 5x lower than SFT (5e-5) — we're sharpening, not retraining
    ecg_embedding_lr: 0.0
    adapter_lr: 1.0e-4
    cross_attention_lr: 1.0e-4
    warmup_steps: 50  # data is small (~570 rows), don't burn warmup
    debug_config:
      log_gradient_norms: true

debug_config:
  log_gradient_norms: true
  show_sample_outputs: false
  log_frequency: 25

# Optimizer / scheduler
llm_lr: 1.0e-5
adapter_lr: 1.0e-4
llm_weight_decay: 1.0e-5
adapter_weight_decay: 1.0e-5
scheduler_type: "cosine_with_warmup"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.1
num_hard_restarts_cycles: 0.5
warm_restart_tmult: 2

# Stage-1 bridge
stage1_checkpoint_path: "checkpoints/ECG_Text_Stage1/ecg_text_stage1/BEST_QFORMER_MEDGEMMA_j4bb0w33_20251113-141927/checkpoints/stage1_last_epoch_010.pt"
decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
tokenizer_name: "google/medgemma-4b-it"
use_auto_processor: false
max_token_length: 640
num_ecg_tokens: 0
instruct_mode: true
prefix_tuning: false
huggingface_model_name: "google/medgemma-4b-it"
medgemma_prompt_style: true

# Bridge
bridge_name: "InstructionAwareECGQFormerBridge"
bridge_mid_dim: 768
bridge_num_heads: 12
bridge_dropout: 0.1
bridge_num_special_tokens: 4
num_query_tokens: 32
bridge_qformer_layers: 10
bridge_text_hidden_size: 768
bridge_bias_last_codebook: 0.5
bridge_codebook_dropout: 0.0
bridge_cross_every: 2
instruction_dropout: 0.2
use_cross_attention: false
num_attention_heads: 8
intermediate_dim: 1024

# Codebook
num_codebooks_kept: 8
codebook_offset: -1
num_quantizers: 8
ecg_codebook_size: 512
llm_input_embedding_size: 2560

# LoRA — must match the resume checkpoint exactly
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_top_k_layers: 12
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
lora_bias: "none"

# Data — single RFT parquet, no weighted multi-source
train_dataset_path: "/volume/ECG_tokenizer/data/rft_bestof5_v1.parquet"
use_weighted_sampling: false
validation_dataset_path: "/volume/ECG_tokenizer/output/combined_test_qa_m25k_h25k.parquet"
prompt_column: "prompt"
answer_column: "generated_answer"
category_column: "prompt_category"

num_workers: 8
batch_size: 4
signal_path_column: "waveform_path_psa"
ecg_waveform_length: 2500
ecg_num_leads: 12

metrics:
  - "rouge"
  - "bleu"
bertscore_max_batches: 5
compute_category_metrics: true
category_metrics:
  - "rouge"
  - "bleu"

pattern_loss_weight: 0
pattern_bce_pos_weight: 1.0
gradient_accumulation_steps: 4
dataloader_pin_memory: true
max_sequence_length: 768

# Validate less often — dataset is small, training is fast
validation_step_interval: 999999  # disable in-loop validation; we eval separately
validation_snapshot_batches: 5
validation_snapshot_prefix: "step"
validation_subset_size: 200
validation_balance_prompt_categories: true
validation_sampling_seed: 42
train_metric_interval: 100
train_metric_batches: 5

enable_attention_visualization: false
attention_log_frequency: 200
plot_validation_ecgs: false
num_validation_plots: 0
plot_selection_strategy: "worst_random_best"

default_generation_kwargs:
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  no_repeat_ngram_size: 5
  max_new_tokens: 256
  min_new_tokens: 0
  repetition_penalty: 1.10
  force_json: false
  min_tokens_guard: 12
use_cf_eval: false

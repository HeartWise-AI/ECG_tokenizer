# MedGemma instruction tuning configuration with Stage-1 Q-Former bridge.

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "train" # Set to inference to get ALL validation samples with multi-GPU
num_epochs: 10
seed: 42
training_phases:
  phase1_alignment:
    epochs: 10
    freeze_llm: true
    use_lora: true
    llm_lr: 5.0e-6
    ecg_embedding_lr: 0.0 # Embedding matrix stays frozen; keep LR at 0 as a guardrail
    adapter_lr: 2.0e-4
    cross_attention_lr: 2.0e-4
    warmup_steps: 1000
    debug_config:
      log_gradient_norms: true
debug_config:
  log_gradient_norms: true
  show_sample_outputs: true
  log_frequency: 50
base_checkpoint_path: "checkpoints"
pretrained_tokenizer_path: !!str "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
use_wandb: true
llm_lr: 5.0e-6 # Mirror single-phase schedule
adapter_lr: 2.0e-4 # Reduced from 5e-4 to match SIGLIP
llm_weight_decay: 1.0e-3 # Increased from 1e-5 for better regularization
adapter_weight_decay: 1.0e-2 # CRITICAL: Increased from 1e-5 to match SIGLIP
scheduler_type: "cosine_with_warmup"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.03
num_hard_restarts_cycles: 1.0
warm_restart_tmult: 2
stage1_checkpoint_path: "checkpoints/ECG_Text_Stage1/ecg_text_stage1/BEST_QFORMER_MEDGEMMA_j4bb0w33_20251113-141927/checkpoints/stage1_last_epoch_010.pt"
decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
tokenizer_name: "google/medgemma-4b-it"
use_auto_processor: false
max_token_length: 640
num_ecg_tokens: 64
instruct_mode: true
prefix_tuning: false
huggingface_model_name: "google/medgemma-4b-it"
# Bridge configuration
bridge_name: "InstructionAwareECGQFormerBridge"
bridge_mid_dim: 768
bridge_num_heads: 12
bridge_dropout: 0.1
bridge_num_special_tokens: 4
bridge_num_visual_tokens: 32 # align to Stage-1 query count
bridge_qformer_layers: 6 # align to Stage-1 depth for warm start
bridge_text_hidden_size: 768
bridge_bias_last_codebook: 0.5
bridge_codebook_dropout: 0.0
bridge_cross_every: 2
instruction_dropout: 0.1
# Codebook selection: keep the trailing stack of codebooks
num_codebooks_kept: 8 # Keep the full stack of codebooks
codebook_offset: -1 # -1 ensures we always include the last codebooks
num_quantizers: 8
ecg_codebook_size: 512
llm_input_embedding_size: 2560
use_lora: !!bool true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_top_k_layers: 12
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_bias: "none"
# Projection bridge positional encoding (applies when using ECGProjectionBridge)
bridge_use_sinusoidal_pos_emb: true
bridge_pos_embedding_max_len: 4096
train_dataset_path: !!str "/volume/ECG_tokenizer/output/combined_train_qa_m200k_h200k.parquet"
validation_dataset_path: !!str "/volume/ECG_tokenizer/output/combined_test_qa_m25k_h25k.parquet"
prompt_column: "prompt"
answer_column: "generated_answer"
category_column: "prompt_category"
num_workers: 12
batch_size: 16
signal_path_column: "waveform_path_psa"
ecg_waveform_length: 2500
ecg_num_leads: 12
metrics:
  - "rouge"
  - "bleu"
  - "meteor"
  - "bertscore"
compute_category_metrics: true
category_metrics:
  - "rouge"
  - "bleu"
  - "meteor"
pattern_loss_weight: 0.0
gradient_accumulation_steps: 8
dataloader_pin_memory: true
max_sequence_length: 768
enable_attention_visualization: false
attention_log_frequency: 200
plot_validation_ecgs: true
num_validation_plots: 6
plot_selection_strategy: "worst_random_best"
default_generation_kwargs:
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 32
  min_new_tokens: 0
  repetition_penalty: 1.02
debug_prompt_dump: true
debug_prompt_stop_after_first_batch: true
debug_ablate_ecg: null
debug_shuffle_prompts: false

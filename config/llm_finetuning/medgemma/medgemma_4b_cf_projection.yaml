# MedGemma 4B CF training using Q-Former bridge on train/val CF parquet datasets.

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "train"
num_epochs: 2
seed: 42
# Single-phase training (freeze LLM, tune encoder/bridge with LoRA on LLM)
training_phases:
  phase1_alignment:
    epochs: 2
    freeze_llm: true
    use_lora: true
    llm_lr: 5.0e-5
    adapter_lr: 5.0e-4
    warmup_steps: 500
    debug_config:
      log_gradient_norms: true
debug_config:
  log_gradient_norms: true
  show_sample_outputs: false
  log_frequency: 200
base_checkpoint_path: "checkpoints"
pretrained_tokenizer_path: !!str "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
# Warm-start the Q-Former bridge from Stage-1
stage1_checkpoint_path: "checkpoints/ECG_Text_Stage1/ecg_text_stage1/BEST_QFORMER_MEDGEMMA_j4bb0w33_20251113-141927/checkpoints/stage1_last_epoch_010.pt"
wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
use_wandb: true
# Optimizer & scheduler (match champion 5M projection config)
llm_lr: 5.0e-5
adapter_lr: 5.0e-4
llm_weight_decay: 1.0e-5
adapter_weight_decay: 1.0e-5
scheduler_type: "cosine"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.0
num_hard_restarts_cycles: 0.0
warm_restart_tmult: 0.0
# Decoder & tokenizer
decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
tokenizer_name: "google/medgemma-4b-it"
use_auto_processor: false
max_token_length: 640
num_ecg_tokens: 128
# CF objective uses MedGemma chat-style prompts with option letters
instruct_mode: true
prefix_tuning: false
huggingface_model_name: "google/medgemma-4b-it"
# Bridge configuration (Instruction-aware Q-Former aligned to Stage-1)
bridge_name: "InstructionAwareECGQFormerBridge"
llm_input_embedding_size: 2560
# Q-Former queries replace explicit visual token placeholders in the text
num_query_tokens: 32
bridge_mid_dim: 768 # match Stage-1 hidden size
bridge_num_heads: 12 # match Stage-1 heads
bridge_dropout: 0.1
bridge_num_special_tokens: 4
bridge_qformer_layers: 6 # match Stage-1 layer count
bridge_text_hidden_size: 768
bridge_bias_last_codebook: 0.5
bridge_codebook_dropout: 0.0 # match Stage-1
bridge_cross_every: 2 # match Stage-1 cross-attention frequency
instruction_dropout: 0.2
# Positional encoding knobs are ignored by Q-Former but kept for compatibility
bridge_use_sinusoidal_pos_emb: true
bridge_pos_embedding_max_len: 4096
# LoRA configuration (applied to LLM)
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_top_k_layers: 16
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_bias: "none"
# Dataset paths: new CF parquet train/val (no instruction format)
data_mode: "cf"
train_dataset_path: "/volume/ECG_tokenizer/output/train_val_cf_parquet/train_cf_m40000_h40000.parquet"
validation_dataset_path: "/volume/ECG_tokenizer/output/train_val_cf_parquet/val_cf_m2000_h2000.parquet"
signal_path_column: "signal_path"
prompt_column: "question"
answer_column: "ground_truth_answer"
category_column: "category"
medgemma_prompt_style: true
debug_print_example: true
num_workers: 24
batch_size: 16
ecg_waveform_length: 2500
ecg_num_leads: 12
# Auxiliary multilabel head (mirrors champion config)
pattern_loss_weight: 0.3
pattern_bce_pos_weight: 1.0
pattern_label_columns:
  - "Sinusal"
  - "Regular"
  - "Monomorph"
  - "QS complex in V1-V2-V3"
  - "R complex in V5-V6"
  - "T wave inversion (inferior - II, III, aVF)"
  - "Left bundle branch block"
  - "RaVL > 11 mm"
  - "SV1 + RV5 or RV6 > 35 mm"
  - "T wave inversion (lateral -I, aVL, V5-V6)"
  - "T wave inversion (anterior - V3-V4)"
  - "Left axis deviation"
  - "Left ventricular hypertrophy"
  - "Bradycardia"
  - "Q wave (inferior - II, III, aVF)"
  - "Afib"
  - "Irregularly irregular"
  - "Atrial tachycardia (>= 100 BPM)"
  - "Nonspecific intraventricular conduction delay"
  - "Premature ventricular complex"
  - "Polymorph"
  - "T wave inversion (septal- V1-V2)"
  - "Right bundle branch block"
  - "Ventricular paced"
  - "ST elevation (anterior - V3-V4)"
  - "ST elevation (septal - V1-V2)"
  - "1st degree AV block"
  - "Premature atrial complex"
  - "Atrial flutter"
  - "rSR' in V1-V2"
  - "qRS in V5-V6-I, aVL"
  - "Left anterior fascicular block"
  - "Right axis deviation"
  - "2nd degree AV block - mobitz 1"
  - "ST depression (inferior - II, III, aVF)"
  - "Acute pericarditis"
  - "ST elevation (inferior - II, III, aVF)"
  - "Low voltage"
  - "Regularly irregular"
  - "Junctional rhythm"
  - "Left atrial enlargement"
  - "ST elevation (lateral - I, aVL, V5-V6)"
  - "Atrial paced"
  - "Right ventricular hypertrophy"
  - "Delta wave"
  - "Wolff-Parkinson-White (Pre-excitation syndrome)"
  - "Prolonged QT"
  - "ST depression (anterior - V3-V4)"
  - "QRS complex negative in III"
  - "Q wave (lateral- I, aVL, V5-V6)"
  - "Supraventricular tachycardia"
  - "ST downslopping"
  - "ST depression (lateral - I, avL, V5-V6)"
  - "2nd degree AV block - mobitz 2"
  - "U wave"
  - "R/S ratio in V1-V2 >1"
  - "RV1 + SV6 > 11 mm"
  - "Left posterior fascicular block"
  - "Right atrial enlargement"
  - "ST depression (septal- V1-V2)"
  - "Q wave (septal- V1-V2)"
  - "Q wave (anterior - V3-V4)"
  - "ST upslopping"
  - "Right superior axis"
  - "Ventricular tachycardia"
  - "ST elevation (posterior - V7-V8-V9)"
  - "Ectopic atrial rhythm (< 100 BPM)"
  - "Lead misplacement"
  - "Third Degree AV Block"
  - "Acute MI"
  - "Early repolarization"
  - "Q wave (posterior - V7-V9)"
  - "Bi-atrial enlargement"
  - "LV pacing"
  - "Brugada"
  - "Ventricular Rhythm"
  - "no_qrs"
# Text metrics (still useful on CF answers)
metrics:
  - "rouge"
  - "bleu"
  - "meteor"
bertscore_max_batches: 5
compute_category_metrics: true
category_metrics:
  - "rouge"
  - "bleu"
  - "meteor"
# Training optimizations
gradient_accumulation_steps: 16
dataloader_pin_memory: true
max_sequence_length: 768
# CF Evaluation using cf template (per-candidate scoring)
use_cf_eval: true
cf_eval_dataset_path: "/volume/ECG_tokenizer/output/train_val_cf_parquet/val_cf_m2000_h2000.parquet"
cf_eval_interval: 500
cf_eval_samples: 500
cf_eval_log_details: true
cf_eval_log_k: 12
cf_eval_write_predictions: true
cf_eval_predictions_max: 0
# Generation defaults
default_generation_kwargs:
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  no_repeat_ngram_size: 5
  max_new_tokens: 64
  min_new_tokens: 0
  repetition_penalty: 1.05
  force_json: false
  min_tokens_guard: 8
debug_prompt_dump: true
debug_prompt_stop_after_first_batch: false
debug_ablate_ecg: false
debug_shuffle_prompts: false

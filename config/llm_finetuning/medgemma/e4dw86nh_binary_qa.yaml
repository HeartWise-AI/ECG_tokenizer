# e4dw86nh champion + binary per-diagnosis Yes/No QA pairs
# Uses multi-dataset: original weighted data (95%) + binary QA (5%)
# Resumes from e4dw86nh checkpoint, adds prompt variations too.

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "train"
num_epochs: 1
seed: 42
training_phases:
  phase1_alignment:
    epochs: 1
    freeze_llm: true
    use_lora: true
    llm_lr: 5.0e-5
    ecg_embedding_lr: 0.0
    adapter_lr: 5.0e-4
    cross_attention_lr: 5.0e-4
    warmup_steps: 2000
    debug_config:
      log_gradient_norms: true
debug_config:
  log_gradient_norms: true
  show_sample_outputs: false
  log_frequency: 50
base_checkpoint_path: "checkpoints"
pretrained_tokenizer_path: !!str "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
resume_checkpoint_path: !!str "/media/data1/models/ECG_Tokenizer/e4dw86nh_20251220-232839/best_model.pt"
wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
use_wandb: true
# Optimizer & scheduler
llm_lr: 5.0e-5
adapter_lr: 5.0e-4
llm_weight_decay: 1.0e-5
adapter_weight_decay: 1.0e-5
scheduler_type: "cosine_with_warmup"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.256
num_hard_restarts_cycles: 0.5
warm_restart_tmult: 2
# Stage-1 bridge
stage1_checkpoint_path: "checkpoints/ECG_Text_Stage1/ecg_text_stage1/BEST_QFORMER_MEDGEMMA_j4bb0w33_20251113-141927/checkpoints/stage1_last_epoch_010.pt"
decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
tokenizer_name: "google/medgemma-4b-it"
use_auto_processor: false
max_token_length: 640
num_ecg_tokens: 0
instruct_mode: true
prefix_tuning: false
huggingface_model_name: "google/medgemma-4b-it"
medgemma_prompt_style: true
# Bridge
bridge_name: "InstructionAwareECGQFormerBridge"
bridge_mid_dim: 768
bridge_num_heads: 12
bridge_dropout: 0.1
bridge_num_special_tokens: 4
num_query_tokens: 32
bridge_qformer_layers: 10
bridge_text_hidden_size: 768
bridge_bias_last_codebook: 0.5
bridge_codebook_dropout: 0.0
bridge_cross_every: 2
instruction_dropout: 0.2
use_cross_attention: false
num_attention_heads: 8
intermediate_dim: 1024
# Codebook
num_codebooks_kept: 8
codebook_offset: -1
num_quantizers: 8
ecg_codebook_size: 512
llm_input_embedding_size: 2560
# LoRA
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_top_k_layers: 12
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
lora_bias: "none"
# Required by config schema (multi-dataset overrides this)
train_dataset_path: "/volume/ECG_tokenizer/output/combined_train_qa_m5000k_h5000k_weighted.parquet"
# ============================================================
# MULTI-DATASET: original weighted + binary diagnosis QA
# ============================================================
train_dataset_paths:
  - "/volume/ECG_tokenizer/output/combined_train_qa_m5000k_h5000k_weighted.parquet"
  - "/volume/ECG_tokenizer/output/binary_diagnosis_qa_train.parquet"
dataset_weights:
  - 0.95
  - 0.05
use_weighted_sampling: true
sample_weight_column: "sample_weight"
# ============================================================
# Prompt variations (per-prompt level)
prompt_variations_path: "dataset_generation/prompt_variations_per_prompt.json"
# ============================================================
validation_dataset_path: "/volume/ECG_tokenizer/output/combined_test_qa_m25k_h25k.parquet"
prompt_column: "prompt"
answer_column: "generated_answer"
category_column: "prompt_category"
num_workers: 24
batch_size: 16
signal_path_column: "waveform_path_psa"
ecg_waveform_length: 2500
ecg_num_leads: 12
# Metrics
metrics:
  - "rouge"
  - "bleu"
  - "meteor"
  - "bertscore"
  - "json_parse_rate"
  - "structured_f1"
bertscore_max_batches: 10
compute_category_metrics: true
category_metrics:
  - "rouge"
  - "bleu"
  - "meteor"
pattern_loss_weight: 0
pattern_bce_pos_weight: 1.0
# Training
gradient_accumulation_steps: 16
dataloader_pin_memory: true
max_sequence_length: 768
# Validation
validation_step_interval: 1000
validation_snapshot_batches: 20
validation_snapshot_prefix: "step"
validation_subset_size: 2000
validation_balance_prompt_categories: true
validation_sampling_seed: 42
train_metric_interval: 9600
train_metric_batches: 10
# Visualization
enable_attention_visualization: false
attention_log_frequency: 200
plot_validation_ecgs: true
num_validation_plots: 6
plot_selection_strategy: "worst_random_best"
# Generation
default_generation_kwargs:
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  no_repeat_ngram_size: 5
  max_new_tokens: 96
  min_new_tokens: 0
  repetition_penalty: 1.10
  force_json: false
  min_tokens_guard: 12
use_cf_eval: false

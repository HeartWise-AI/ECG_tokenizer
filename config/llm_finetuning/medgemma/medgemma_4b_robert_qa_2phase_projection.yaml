# MedGemma 4B QA finetuning on 5M weighted dataset using ECGProjectionBridge.
# Two-phase schedule (phase1 alignment + phase2 finetuning).

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "train"
num_epochs: 10
seed: 42
# Two-phase training (phase1 alignment + phase2 finetuning)
training_phases:
  phase1_alignment:
    epochs: 1
    freeze_llm: true
    use_lora: false
    # Higher LR on bridge to align projection with frozen LLM
    adapter_lr: 5.0e-5
    llm_lr: 5.0e-5
    warmup_steps: 100
    # Optional: train on a subset of the train set during phase1 (e.g., 0.25 = 25%)
    train_subset_ratio: 0.25
    debug_config:
      log_gradient_norms: true
  phase2_finetuning:
    epochs: 8
    freeze_llm: true
    use_lora: true
    # Match projection champion llm_lr
    llm_lr: 0.000003
    adapter_lr: 0.000005
    warmup_steps: 50
    debug_config:
      log_gradient_norms: true
debug_config:
  log_gradient_norms: true
  show_sample_outputs: true
  log_frequency: 50
base_checkpoint_path: "checkpoints"
pretrained_tokenizer_path: "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
use_wandb: true
# Optimizer & scheduler
llm_lr: 5.0e-5
adapter_lr: 1.0e-4
llm_weight_decay: 0.0
adapter_weight_decay: 0.0
scheduler_type: "cosine_with_warmup"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.15
num_hard_restarts_cycles: 0.5
warm_restart_tmult: 2
# Decoder & tokenizer
decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
tokenizer_name: "google/medgemma-4b-it"
use_auto_processor: false
max_token_length: 640
# Keep 0 so ECG embeddings are injected after <start_of_image> (no placeholder tokens)
num_ecg_tokens: 0
instruct_mode: true
prefix_tuning: false
huggingface_model_name: "google/medgemma-4b-it"
# Use MedGemma chat template with <start_of_turn>/<end_of_turn> and <start_of_image>
medgemma_prompt_style: true
debug_print_example: true
debug_ecg_injection: true
# Latest projection bridge (formerly LL(M) projection bridge)
bridge_name: "ECGProjectionBridge"
llm_input_embedding_size: 2560
# Projection output tokens (independent of num_ecg_tokens placeholders)
bridge_num_visual_tokens: 128
bridge_use_sinusoidal_pos_emb: true
bridge_pos_embedding_max_len: 4096
bridge_mid_dim: 512
bridge_num_heads: 8
bridge_dropout: 0.1
bridge_num_special_tokens: 4
bridge_qformer_layers: 6
bridge_text_hidden_size: 512
bridge_bias_last_codebook: 0.5
bridge_codebook_dropout: 0.0
bridge_cross_every: 2
instruction_dropout: 0.0
# Codebook selection (match stage-1 tokenizer with 8 codebooks)
num_codebooks_kept: 8
codebook_offset: -1
# Optional sequence/attention knobs
use_cross_attention: false
num_attention_heads: 8
intermediate_dim: 1024
# Dataset paths (5M weighted QA)
train_dataset_path: "/volume/ECG_tokenizer/output/combined_train_qa_m5000k_h5000k_weighted.parquet"
validation_dataset_path: "/volume/ECG_tokenizer/output/combined_test_qa_m25k_h25k.parquet"
# Weighted sampling for minority class upsampling
use_weighted_sampling: true
sample_weight_column: "sample_weight"
prompt_column: "prompt"
answer_column: "generated_answer"
category_column: "prompt_category"
num_workers: 24
batch_size: 16
signal_path_column: "waveform_path_psa"
# ECG waveform parameters
ecg_waveform_length: 2500
ecg_num_leads: 12
# Metrics
metrics:
  - "rouge"
  - "bleu"
  - "meteor"
  - "bertscore"
  - "json_parse_rate"
  - "structured_f1"
# Compute BERTScore on up to 10 batches by default
bertscore_max_batches: 10
compute_category_metrics: true
category_metrics:
  - "rouge"
  - "bleu"
  - "meteor"
pattern_loss_weight: 0
pattern_bce_pos_weight: 1.0
# Training optimizations
gradient_accumulation_steps: 16
dataloader_pin_memory: true
max_sequence_length: 768
# Mid-epoch validation & train snapshots
validation_step_interval: 1000
validation_snapshot_batches: 20
validation_snapshot_prefix: "step"
validation_subset_size: 2000
validation_balance_prompt_categories: true
validation_sampling_seed: 42
train_metric_interval: 9600
train_metric_batches: 10
enable_attention_visualization: false
attention_log_frequency: 200
plot_validation_ecgs: true
num_validation_plots: 6
plot_selection_strategy: "worst_random_best"
# Generation parameters (deterministic defaults; router overrides per task)
default_generation_kwargs:
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  top_k: 0

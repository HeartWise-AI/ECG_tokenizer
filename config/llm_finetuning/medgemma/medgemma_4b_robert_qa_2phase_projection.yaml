# MedGemma 4B QA finetuning on Robert dataset (200k/5k)
# Two-phase schedule with increased LR using ECGProjectionBridge.

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "train"
num_epochs: 10
seed: 42
# Two-phase training (phase1 alignment + phase2 finetuning)
training_phases:
  phase1_alignment:
    epochs: 2
    freeze_llm: true
    use_lora: false
    # Higher LR on bridge to align projection with frozen LLM
    adapter_lr: 5.0e-5
    llm_lr: 5.0e-5
    warmup_steps: 100
    debug_config:
      log_gradient_norms: true
  phase2_finetuning:
    epochs: 8
    freeze_llm: true
    use_lora: true
    # Match projection champion llm_lr
    llm_lr: 0.000003
    adapter_lr: 0.000005
    warmup_steps: 50
    debug_config:
      log_gradient_norms: true
debug_config:
  log_gradient_norms: true
  show_sample_outputs: true
  log_frequency: 50
base_checkpoint_path: "checkpoints"
pretrained_tokenizer_path: "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
use_wandb: true
# Optimizer & scheduler
llm_lr: 5.0e-5
adapter_lr: 1.0e-4
llm_weight_decay: 0.0
adapter_weight_decay: 0.0
scheduler_type: "cosine_with_warmup"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.15
num_hard_restarts_cycles: 0.5
warm_restart_tmult: 2
# Decoder & tokenizer
decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
tokenizer_name: "google/medgemma-4b-it"
use_auto_processor: false
max_token_length: 640
num_ecg_tokens: 128
instruct_mode: true
prefix_tuning: false
huggingface_model_name: "google/medgemma-4b-it"
# Latest projection bridge (formerly LL(M) projection bridge)
bridge_name: "ECGProjectionBridge"
llm_input_embedding_size: 2560
bridge_num_visual_tokens: 128 # keep aligned with num_ecg_tokens
bridge_use_sinusoidal_pos_emb: true
bridge_pos_embedding_max_len: 4096
bridge_mid_dim: 512
bridge_num_heads: 8
bridge_dropout: 0.1
bridge_num_special_tokens: 4
bridge_qformer_layers: 6
bridge_text_hidden_size: 512
bridge_bias_last_codebook: 0.5
bridge_codebook_dropout: 0.0
bridge_cross_every: 2
instruction_dropout: 0.0
# Optional sequence/attention knobs
use_cross_attention: false
num_attention_heads: 8
intermediate_dim: 1024
# Dataset paths (Robert QA)
train_dataset_path: "/media/data1/datasets/ECG_Tokenizer/parquets/robert_dataset_qa/output/combined_train_qa_m200k_h200k.parquet"
validation_dataset_path: "/media/data1/datasets/ECG_Tokenizer/parquets/robert_dataset_qa/output/combined_test_qa_m5k_h5k.parquet"
prompt_column: "prompt"
answer_column: "generated_answer"
category_column: "prompt_category"
num_workers: 8
batch_size: 24
signal_path_column: "waveform_path_psa"
# ECG waveform parameters
ecg_waveform_length: 2500
ecg_num_leads: 12
# Metrics
metrics:
  - "rouge"
  - "bleu"
  - "meteor"
  - "bertscore"
bertscore_max_batches: 5
compute_category_metrics: true
category_metrics:
  - "rouge"
  - "bleu"
  - "meteor"
# Training optimizations
gradient_accumulation_steps: 8
dataloader_pin_memory: true
max_sequence_length: 768
enable_attention_visualization: false
attention_log_frequency: 200

# Combined multi-task fine-tuning: 5M weighted + SFT tasks (potassium, HCM, symptom)
# Resumes from BEST LLM checkpoint, trains on everything to avoid catastrophic forgetting.
# Run: bash scripts/runner.sh --base_config config/llm_finetuning/medgemma/sft_combined_multitask.yaml --selected_gpus 2,3 --use_wandb true --run_mode train --instruct_mode true

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "train"
num_epochs: 2
seed: 42
# Resume from BEST LLM checkpoint
resume_checkpoint_path: "checkpoints/BEST_LLM/e4dw86nh_20251220-232839_BEST_QFORMER_8CB/checkpoint_epoch_1.pt"
# Training phases - single phase (bridge already aligned)
training_phases:
  phase1_alignment:
    epochs: 0
    freeze_llm: true
debug_config:
  log_gradient_norms: true
  show_sample_outputs: false
  log_frequency: 50
base_checkpoint_path: "checkpoints"
pretrained_tokenizer_path: !!str "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
use_wandb: true
# Lower LR for continued fine-tuning (avoid catastrophic forgetting)
llm_lr: 2.0e-5
adapter_lr: 2.0e-4
llm_weight_decay: 1.0e-5
adapter_weight_decay: 1.0e-5
scheduler_type: "cosine_with_warmup"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.10
num_hard_restarts_cycles: 0.5
warm_restart_tmult: 2
# Warm-start bridge from Stage-1
stage1_checkpoint_path: "checkpoints/ECG_Text_Stage1/ecg_text_stage1/BEST_QFORMER_MEDGEMMA_j4bb0w33_20251113-141927/checkpoints/stage1_last_epoch_010.pt"
decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
tokenizer_name: "google/medgemma-4b-it"
use_auto_processor: false
max_token_length: 640
num_ecg_tokens: 0
instruct_mode: true
prefix_tuning: false
huggingface_model_name: "google/medgemma-1.5-4b-it"
medgemma_prompt_style: true
# Bridge configuration (same as BEST)
bridge_name: "InstructionAwareECGQFormerBridge"
bridge_mid_dim: 768
bridge_num_heads: 12
bridge_dropout: 0.1
bridge_num_special_tokens: 4
num_query_tokens: 32
bridge_qformer_layers: 10
bridge_text_hidden_size: 768
bridge_bias_last_codebook: 0.5
bridge_codebook_dropout: 0.0
bridge_cross_every: 2
instruction_dropout: 0.2
use_cross_attention: false
num_attention_heads: 8
intermediate_dim: 1024
# Codebook selection (same as BEST)
num_codebooks_kept: 8
codebook_offset: -1
num_quantizers: 8
ecg_codebook_size: 512
llm_input_embedding_size: 2560
# LoRA configuration (same as BEST)
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_top_k_layers: 12
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
lora_bias: "none"
# ============================================================
# MULTI-DATASET CONFIGURATION
# Combined 5M weighted + SFT tasks with upsampling weights
# Target distribution: ~80% combined, ~10% HCM, ~7% symptom, ~3% potassium
# ============================================================
train_dataset_paths:
  - "/volume/ECG_tokenizer/output/combined_train_qa_m5000k_h5000k_weighted.parquet"
  - "/volume/ECG_tokenizer/output/sft_hcm_train.parquet"
  - "/volume/ECG_tokenizer/output/sft_symptom_train.parquet"
  - "/volume/ECG_tokenizer/output/sft_potassium_train.parquet"
# Weights: combined=1.0, HCM=9x, symptom=20x, potassium=70x
# Effective: 7.27M + 909K + 640K + 280K = ~9.1M weighted samples
# Ratios: 80% combined / 10% HCM / 7% symptom / 3% potassium
dataset_weights: [1.0, 9.0, 20.0, 70.0]
# Validate on both combined test AND SFT tests
validation_dataset_paths:
  - "/volume/ECG_tokenizer/output/combined_test_qa_m25k_h25k.parquet"
  - "/volume/ECG_tokenizer/output/sft_potassium_test.parquet"
  - "/volume/ECG_tokenizer/output/sft_hcm_test.parquet"
  - "/volume/ECG_tokenizer/output/sft_symptom_test.parquet"
# Use pre-adjusted signals
signal_path_column: "waveform_path_psa"
# ECG augmentations
ecg_augmentation_enabled: true
ecg_augmentation_prob: 0.5
ecg_augmentation_amplitude_min: 0.8
ecg_augmentation_amplitude_max: 1.2
# Single-dataset fallback (not used when train_dataset_paths is set)
train_dataset_path: "/volume/ECG_tokenizer/output/combined_train_qa_m5000k_h5000k_weighted.parquet"
validation_dataset_path: "/volume/ECG_tokenizer/output/combined_test_qa_m25k_h25k.parquet"
# ============================================================

prompt_column: "prompt"
answer_column: "generated_answer"
category_column: "prompt_category"
# No pattern loss (SFT datasets don't have 77 ECG pattern columns)
pattern_label_columns: []
pattern_loss_weight: 0
pattern_bce_pos_weight: 1.0
num_workers: 24
batch_size: 8
ecg_waveform_length: 2500
ecg_num_leads: 12
# Metrics
metrics:
  - "rouge"
  - "bleu"
  - "meteor"
  - "bertscore"
bertscore_max_batches: 10
compute_category_metrics: true
category_metrics:
  - "rouge"
  - "bleu"
  - "meteor"
# Training optimizations
gradient_accumulation_steps: 16
dataloader_pin_memory: true
max_sequence_length: 768
# Mid-epoch validation (more frequent since dataset is large)
validation_step_interval: 2000
validation_snapshot_batches: 10
validation_snapshot_prefix: "step"
validation_subset_size: 500
validation_balance_prompt_categories: true
validation_sampling_seed: 42
train_metric_interval: 500
train_metric_batches: 5
# Visualization
enable_attention_visualization: false
plot_validation_ecgs: true
num_validation_plots: 6
plot_selection_strategy: "worst_random_best"
# Generation parameters
default_generation_kwargs:
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  no_repeat_ngram_size: 5
  max_new_tokens: 96
  min_new_tokens: 0
  repetition_penalty: 1.10
  force_json: false
  min_tokens_guard: 12
# CF Evaluation
use_cf_eval: false

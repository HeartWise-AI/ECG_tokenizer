# Chain-of-Thought SFT fine-tuning (ECG-R1 aligned)
# Trains on 20k CoT examples with <think> 6-step reasoning + <answer> diagnosis.
# Resumes from BEST LLM checkpoint (pnsncqqv).
# Run: bash scripts/runner.sh --base_config config/llm_finetuning/medgemma/cot_sft.yaml --selected_gpus 0,1 --use_wandb true --run_mode train --instruct_mode true

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "train"
num_epochs: 1
seed: 42
# Resume from BEST LLM checkpoint (pnsncqqv)
resume_checkpoint_path: "checkpoints/BEST_LLM/ECG_Augment_pnsncqqv_20260217-041628/best_model.pt"
# Training phases - single phase (bridge already aligned)
training_phases:
  phase1_alignment:
    epochs: 0
    freeze_llm: true
debug_config:
  log_gradient_norms: true
  show_sample_outputs: false
  log_frequency: 50
base_checkpoint_path: "checkpoints"
pretrained_tokenizer_path: !!str "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
use_wandb: true
# Learning rates (match ECG-R1 SFT: 2e-5)
llm_lr: 2.0e-5
adapter_lr: 2.0e-4
llm_weight_decay: 1.0e-5
adapter_weight_decay: 1.0e-5
scheduler_type: "cosine_with_warmup"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.10
num_hard_restarts_cycles: 0.5
warm_restart_tmult: 2
# Warm-start bridge from Stage-1
stage1_checkpoint_path: "checkpoints/ECG_Text_Stage1/ecg_text_stage1/BEST_QFORMER_MEDGEMMA_j4bb0w33_20251113-141927/checkpoints/stage1_last_epoch_010.pt"
decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
tokenizer_name: "google/medgemma-4b-it"
use_auto_processor: false
instruct_mode: true
prefix_tuning: false
huggingface_model_name: "google/medgemma-1.5-4b-it"
medgemma_prompt_style: true
# ============================================================
# KEY CHANGE: Increased token lengths for CoT reasoning
# CoT responses are ~800-1200 tokens; previous config capped at 96.
# ============================================================
max_token_length: 1536
num_ecg_tokens: 0
max_sequence_length: 2048
# Bridge configuration (same as BEST pnsncqqv)
bridge_name: "InstructionAwareECGQFormerBridge"
bridge_mid_dim: 768
bridge_num_heads: 12
bridge_dropout: 0.1
bridge_num_special_tokens: 4
num_query_tokens: 32
bridge_qformer_layers: 10
bridge_text_hidden_size: 768
bridge_bias_last_codebook: 0.5
bridge_codebook_dropout: 0.0
bridge_cross_every: 2
instruction_dropout: 0.2
use_cross_attention: false
num_attention_heads: 8
intermediate_dim: 1024
# Codebook selection (same as BEST)
num_codebooks_kept: 8
codebook_offset: -1
num_quantizers: 8
ecg_codebook_size: 512
llm_input_embedding_size: 2560
# LoRA configuration (same as BEST)
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_top_k_layers: 12
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
lora_bias: "none"
# ============================================================
# COT DATASET CONFIGURATION
# Single-task: only CoT data (ECG-R1 does SFT on CoT examples only)
# Uses messages_column for chat-format parsing
# ============================================================
train_dataset_path: "/volume/ECG_tokenizer/output/cot_train.parquet"
validation_dataset_path: "/volume/ECG_tokenizer/output/cot_val.parquet"
signal_path_column: "waveform_path_psa"
messages_column: "messages"
# prompt/answer columns are unused when messages_column is set, but required by config
prompt_column: "report"
answer_column: "report"
category_column: "source"
# No pattern loss (CoT dataset doesn't have ECG pattern columns)
pattern_label_columns: []
pattern_loss_weight: 0
pattern_bce_pos_weight: 1.0
# ECG signal parameters
ecg_waveform_length: 2500
ecg_num_leads: 12
# ECG augmentations (keep enabled)
ecg_augmentation_enabled: true
ecg_augmentation_prob: 0.5
ecg_augmentation_amplitude_min: 0.8
ecg_augmentation_amplitude_max: 1.2
ecg_augmentation_noise_snr_min: 15.0
ecg_augmentation_noise_snr_max: 40.0
ecg_augmentation_wander_min: 0.01
ecg_augmentation_wander_max: 0.15
# ============================================================
# TRAINING OPTIMIZATIONS
# Reduced grad accum: 4 (was 16) → effective batch = 64 (was 256)
# Aligns closer to ECG-R1's effective batch of 64
# ============================================================
num_workers: 24
batch_size: 6
gradient_accumulation_steps: 6
dataloader_pin_memory: true
# Metrics
metrics:
  - "rouge"
  - "bleu"
  - "meteor"
  - "bertscore"
bertscore_max_batches: 10
compute_category_metrics: false
# Validation (more frequent for smaller dataset)
validation_step_interval: 1000
validation_snapshot_batches: 10
validation_snapshot_prefix: "step"
validation_subset_size: 500
validation_balance_prompt_categories: false
validation_sampling_seed: 42
train_metric_interval: 200
train_metric_batches: 5
# Visualization
enable_attention_visualization: false
plot_validation_ecgs: true
num_validation_plots: 6
plot_selection_strategy: "worst_random_best"
# ============================================================
# GENERATION PARAMETERS (adapted for CoT)
# max_new_tokens: 1024 (was 96) — CoT responses need ~800-1200 tokens
# No repeat ngram penalty removed — CoT has natural step header repetition
# Repetition penalty 1.0 — ECG-R1 doesn't penalize during CoT
# ============================================================
default_generation_kwargs:
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 1024
  min_new_tokens: 0
  repetition_penalty: 1.0
  force_json: false
  min_tokens_guard: 12
# CF Evaluation
use_cf_eval: false

# MedGemma OPTIMIZED finetuning configuration
# Based on SIGLIP adapter successful hyperparameters
# Key changes: adapter_weight_decay (1e-5 → 1e-2), adapter_lr (5e-4 → 2e-4), 
#              gradient_accumulation_steps (8 → 16), num_epochs (10 → 15)

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "train" # Set to inference to get ALL validation samples with multi-GPU
num_epochs: 15  # OPTIMIZED: Increased from 10 to allow longer training with proper regularization
seed: 42
training_phases:
  phase1_alignment:
    epochs: 15  # Match num_epochs
    freeze_llm: true
    use_lora: true
    llm_lr: 5.0e-5
    ecg_embedding_lr: 0.0 # Embedding matrix stays frozen; keep LR at 0 as a guardrail
    adapter_lr: 2.0e-4  # OPTIMIZED: Match SIGLIP (reduced from 5e-4)
    cross_attention_lr: 2.0e-4  # OPTIMIZED: Match adapter_lr
    warmup_steps: 100
    debug_config:
      log_gradient_norms: true
debug_config:
  log_gradient_norms: true
  show_sample_outputs: true
  log_frequency: 50
base_checkpoint_path: "checkpoints"
pretrained_tokenizer_path: "checkpoints/SigLIP_Phase1/siglip_phase1/dss6mj14_20251013-030352/checkpoints/siglip_phase1_best_epoch_9.pt"
wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
use_wandb: true
llm_lr: 5.0e-5 # Mirror single-phase schedule
adapter_lr: 2.0e-4  # OPTIMIZED: Match SIGLIP (reduced from 5e-4 → 2e-4)
llm_weight_decay: 1.0e-3  # OPTIMIZED: Increased from 1e-5 for better regularization (100x)
adapter_weight_decay: 1.0e-2  # CRITICAL OPTIMIZATION: Match SIGLIP (increased from 1e-5 → 1e-2, 1000x!)
scheduler_type: "cosine_with_warmup"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.15
num_hard_restarts_cycles: 1.0
warm_restart_tmult: 2
decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
tokenizer_name: "google/medgemma-4b-it"
use_auto_processor: false
max_token_length: 640
num_ecg_tokens: 128
instruct_mode: true
huggingface_model_name: "google/medgemma-4b-it"
bridge_name: "ECGProjectionBridge"
# Codebook selection: keep the trailing stack of codebooks
num_codebooks_kept: 8 # Keep the full stack of codebooks
codebook_offset: -1 # -1 ensures we always include the last codebooks
llm_input_embedding_size: 2560
use_cross_attention: false
num_attention_heads: 8
intermediate_dim: 1024
use_lora: !!bool true
lora_config:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  top_k_layers: 12
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
train_dataset_path: !!str "/volume/ECG_tokenizer/output/combined_train_qa_m200k_h200k.parquet"
validation_dataset_path: !!str "/volume/ECG_tokenizer/output/combined_test_qa_m5k_h5k.parquet"
prompt_column: "prompt"
answer_column: "generated_answer"
category_column: "prompt_category"
num_workers: 8
batch_size: 14  # Keep at 14 for memory constraints
signal_path_column: "waveform_path_psa"
ecg_waveform_length: 2500
ecg_num_leads: 12
metrics:
  - "rouge"
  - "bleu"
  - "meteor"
  - "bertscore"
compute_category_metrics: true
category_metrics:
  - "rouge"
  - "bleu"
  - "meteor"
gradient_accumulation_steps: 16  # OPTIMIZED: Doubled from 8 → 16 (effective batch: 224)
dataloader_pin_memory: true
max_sequence_length: 768
enable_attention_visualization: false
attention_log_frequency: 200
plot_validation_ecgs: true
num_validation_plots: 6
plot_selection_strategy: "worst_random_best"
default_generation_kwargs:
  min_new_tokens: 48


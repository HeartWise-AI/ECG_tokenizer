# MedGemma instruction tuning configuration - OPTIMIZED
# Based on winning pp0r2qwt checkpoint with improvements:
# - 32 tokens (matches Stage 1 for full weight transfer)
# - Increased Q-Former depth (12 -> 16 layers)
# - Early stopping at epoch 2-3
# - Improved regularization
# - Better generation parameters

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "train"
num_epochs: 10
seed: 42
training_phases:
  phase1_alignment:
    epochs: 10
    freeze_llm: true
    use_lora: true
    llm_lr: 3.0e-6 # REDUCED from 5e-6 for more stability (pp0r2qwt had 5e-6, going lower)
    ecg_embedding_lr: 0.0 # Embedding matrix stays frozen
    adapter_lr: 1.5e-4 # REDUCED from 2e-4 for smoother convergence
    cross_attention_lr: 2.0e-4
    warmup_steps: 1500 # INCREASED from 1000 for more gradual warmup
    debug_config:
      log_gradient_norms: true
debug_config:
  log_gradient_norms: true
  show_sample_outputs: true
  log_frequency: 50
base_checkpoint_path: "checkpoints"
pretrained_tokenizer_path: !!str "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
use_wandb: true
# Main learning rates (mirror phase1 reductions)
llm_lr: 3.0e-6 # REDUCED from 5e-6
adapter_lr: 1.5e-4 # REDUCED from 2e-4
# Weight decay (regularization)
llm_weight_decay: 1.0e-3
adapter_weight_decay: 1.0e-2
# Scheduler
scheduler_type: "cosine_with_warmup"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.03
num_hard_restarts_cycles: 1.0
warm_restart_tmult: 2
# Stage 1 checkpoint (Q-Former pretrained weights)
stage1_checkpoint_path: "checkpoints/ECG_Text_Stage1/ecg_text_stage1/9osc201w_20251029-114746/checkpoints/stage1_best_epoch_009.pt"
# Decoder configuration
decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
tokenizer_name: "google/medgemma-4b-it"
use_auto_processor: false
max_token_length: 640
# TOKEN CONFIGURATION - 32 tokens (matches Stage 1 exactly)
num_ecg_tokens: 32 # MATCHES Stage 1 for full weight transfer
instruct_mode: true
prefix_tuning: false
huggingface_model_name: "google/medgemma-4b-it"
# BRIDGE CONFIGURATION
bridge_name: "InstructionAwareECGQFormerBridge"
bridge_mid_dim: 768 # MUST match Stage 1
bridge_num_heads: 12 # MUST match Stage 1
bridge_dropout: 0.1  # match Stage 1
bridge_num_special_tokens: 4
bridge_num_visual_tokens: 32 # MATCHES num_ecg_tokens
bridge_qformer_layers: 6  # match Stage 1 depth for strict compatibility
bridge_text_hidden_size: 768
bridge_bias_last_codebook: 0.5
bridge_codebook_dropout: 0.0 # match Stage 1
bridge_cross_every: 2 # match Stage 1 cross-attention frequency
instruction_dropout: 0.1
# Codebook selection (MUST match Stage 1)
num_codebooks_kept: 8
codebook_offset: -1
num_quantizers: 8
ecg_codebook_size: 512
llm_input_embedding_size: 2560
# LoRA configuration with improved regularization
use_lora: !!bool true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.08 # INCREASED from 0.05 for better regularization
lora_top_k_layers: 12
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_bias: "none"

# Projection bridge positional encoding (applies when using ECGProjectionBridge)
bridge_use_sinusoidal_pos_emb: true
bridge_pos_embedding_max_len: 4096
# Dataset paths
train_dataset_path: !!str "/media/data1/datasets/ECG_Tokenizer/parquets/robert_dataset_qa/output/combined_train_qa_m200k_h200k.parquet"
validation_dataset_path: !!str "/media/data1/datasets/ECG_Tokenizer/parquets/robert_dataset_qa/output/combined_test_qa_m5k_h5k.parquet"
prompt_column: "prompt"
answer_column: "generated_answer"
category_column: "prompt_category"
# Pattern classification columns (77 ECG patterns from utils/constants.py)
pattern_label_columns:
  - "Sinusal"
  - "Regular"
  - "Monomorph"
  - "QS complex in V1-V2-V3"
  - "R complex in V5-V6"
  - "T wave inversion (inferior - II, III, aVF)"
  - "Left bundle branch block"
  - "RaVL > 11 mm"
  - "SV1 + RV5 or RV6 > 35 mm"
  - "T wave inversion (lateral -I, aVL, V5-V6)"
  - "T wave inversion (anterior - V3-V4)"
  - "Left axis deviation"
  - "Left ventricular hypertrophy"
  - "Bradycardia"
  - "Q wave (inferior - II, III, aVF)"
  - "Afib"
  - "Irregularly irregular"
  - "Atrial tachycardia (>= 100 BPM)"
  - "Nonspecific intraventricular conduction delay"
  - "Premature ventricular complex"
  - "Polymorph"
  - "T wave inversion (septal- V1-V2)"
  - "Right bundle branch block"
  - "Ventricular paced"
  - "ST elevation (anterior - V3-V4)"
  - "ST elevation (septal - V1-V2)"
  - "1st degree AV block"
  - "Premature atrial complex"
  - "Atrial flutter"
  - "rSR' in V1-V2"
  - "qRS in V5-V6-I, aVL"
  - "Left anterior fascicular block"
  - "Right axis deviation"
  - "2nd degree AV block - mobitz 1"
  - "ST depression (inferior - II, III, aVF)"
  - "Acute pericarditis"
  - "ST elevation (inferior - II, III, aVF)"
  - "Low voltage"
  - "Regularly irregular"
  - "Junctional rhythm"
  - "Left atrial enlargement"
  - "ST elevation (lateral - I, aVL, V5-V6)"
  - "Atrial paced"
  - "Right ventricular hypertrophy"
  - "Delta wave"
  - "Wolff-Parkinson-White (Pre-excitation syndrome)"
  - "Prolonged QT"
  - "ST depression (anterior - V3-V4)"
  - "QRS complex negative in III"
  - "Q wave (lateral- I, aVL, V5-V6)"
  - "Supraventricular tachycardia"
  - "ST downslopping"
  - "ST depression (lateral - I, avL, V5-V6)"
  - "2nd degree AV block - mobitz 2"
  - "U wave"
  - "R/S ratio in V1-V2 >1"
  - "RV1 + SV6 > 11 mm"
  - "Left posterior fascicular block"
  - "Right atrial enlargement"
  - "ST depression (septal- V1-V2)"
  - "Q wave (septal- V1-V2)"
  - "Q wave (anterior - V3-V4)"
  - "ST upslopping"
  - "Right superior axis"
  - "Ventricular tachycardia"
  - "ST elevation (posterior - V7-V8-V9)"
  - "Ectopic atrial rhythm (< 100 BPM)"
  - "Lead misplacement"
  - "Third Degree AV Block"
  - "Acute MI"
  - "Early repolarization"
  - "Q wave (posterior - V7-V9)"
  - "Bi-atrial enlargement"
  - "LV pacing"
  - "Brugada"
  - "Ventricular Rhythm"
  - "no_qrs"
num_workers: 12
batch_size: 16
signal_path_column: "waveform_path_psa"
ecg_waveform_length: 2500
ecg_num_leads: 12
# Metrics
metrics:
  - "rouge"
  - "bleu"
  - "meteor"
  - "bertscore"
compute_category_metrics: true
category_metrics:
  - "rouge"
  - "bleu"
  - "meteor"
# Loss configuration
pattern_loss_weight: 0.4 # INCREASED from 0.3 for better structured outputs
# Training configuration
gradient_accumulation_steps: 12 # INCREASED from 8 for more stable gradients
max_grad_norm: 0.5 # Gradient clipping (matches runner expectation)
dataloader_pin_memory: true
max_sequence_length: 768
# Visualization
enable_attention_visualization: false
attention_log_frequency: 200
plot_validation_ecgs: true
num_validation_plots: 6
plot_selection_strategy: "worst_random_best"
# IMPROVED GENERATION PARAMETERS
default_generation_kwargs:
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 48 # INCREASED from 32 for more complete answers
  min_new_tokens: 8 # ADDED to prevent truncation
  repetition_penalty: 1.05 # INCREASED from 1.02 to reduce repetition
  no_repeat_ngram_size: 3 # ADDED to prevent 3-gram repetition
  length_penalty: 1.0 # ADDED for balanced length

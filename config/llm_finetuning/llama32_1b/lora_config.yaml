# pipeline project
pipeline_project: !!str "ECG_Tokenizer_LLM_Finetuning"
model_name: !!str "ECG_Tokenizer_Wrapper"
runner_name: !!str "ECG_Tokenizer_LLM_Finetuning"
run_mode: !!str "train"
num_epochs: !!int 1
seed: !!int 42
base_checkpoint_path: !!str "checkpoints"
pretrained_tokenizer_path: !!str "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
# wandb parameters
wandb_project: !!str "ECG_tokenizer_LLM_finetuning_llama32_1b"
wandb_entity: !!str "mhi_ai"
use_wandb: !!bool true
# optimization (LoRA-friendly LR, matches ECG-Byte recipe)
llm_lr: !!float 2e-4
adapter_lr: !!float 2e-4
llm_weight_decay: !!float 0.0
adapter_weight_decay: !!float 0.0
scheduler_type: !!str "linear_warmup"
lr_step_period: !!int 1
factor: !!float 0.3
optimizer: !!str "AdamW"
step_size: !!int 1
gamma: !!float 0.1
num_warmup_percent: !!float 0.03
num_hard_restarts_cycles: !!float 1.0
warm_restart_tmult: !!int 2
# VQVAE parameters
decoder_mode: !!str "llm"
decoder_name: !!str "Llama32_Decoder"
# LLM tokenizer parameters
tokenizer_name: !!str "meta-llama/Llama-3.2-1B"
max_token_length: !!int 256
# LLM model parameters
huggingface_model_name: !!str "meta-llama/Llama-3.2-1B"
adapter_name: !!str "Llama32_SequenceAdapter"
llm_input_embedding_size: !!int 2048
# Dataset parameters
train_dataset_path: !!str "/volume/ECG_tokenizer/output/combined_train_qa_interpretation_only.parquet"
validation_dataset_path: !!str "/volume/ECG_tokenizer/paper/inputs/combined_test_m25kh25k_interpretation_10k.parquet"
num_workers: !!int 8
batch_size: !!int 16
signal_path_column: !!str "waveform_path_psa"
# ECG parameters
ecg_waveform_length: !!int 2500
ecg_num_leads: !!int 12
# metrics
metrics:
  - !!str "rouge"
  - !!str "bleu"
  - !!str "meteor"

program: run_sweep.py
method: bayes
metric:
  name: rouge_score
  goal: maximize
parameters:
  llm_lr:
    values: [1e-6, 5e-6, 1e-5, 5e-5]
  adapter_lr:
    values: [1e-4, 5e-4, 1e-3]
  batch_size:
    values: [4, 8, 16]
  num_warmup_percent:
    values: [0.05, 0.1, 0.15]
  scheduler_type:
    values: ["cosine_warm_restart", "linear", "cosine"]
  medgemma3n_embedding_size:
    values: [1024, 2048, 3072]
  adapter_name:
    values: ["GPT2_SequenceAdapter", "GPT2_EmbeddingAdapter"]
early_terminate:
  type: hyperband
  max_iter: 10
  eta: 3
  s: 2
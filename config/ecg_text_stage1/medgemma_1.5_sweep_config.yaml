# MedGemma 1.5-4B Stage-1 Q-Former Sweep Configuration
#
# Hyperparameter sweep for ECG-MedGemma 1.5 alignment.
# Uses Bayesian optimization with early stopping.

command:
  - torchrun
  - "--nproc_per_node=2"
  - "--master_port=29520"
  - "scripts/main.py"
  - "--base_config"
  - "config/ecg_text_stage1/medgemma_1.5_base_config.yaml"
  - ${args}

name: "ecg_text_stage1_medgemma1.5_sweep"
project: "ecg_text_stage1_medgemma1.5"
entity: "mhi_ai"
method: bayes

metric:
  name: val/loss
  goal: minimize

parameters:
  lr:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.0004
  weight_decay:
    values: [0.0, 0.005, 0.01, 0.02]
  batch_size:
    values: [64, 96, 120]
  bridge_num_layers:
    values: [6, 8, 10]
  num_query_tokens:
    values: [16, 32, 48]
  bridge_num_heads:
    values: [8, 12]
  cross_every:
    values: [1, 2]
  num_codebooks_kept:
    values: [1, 2, 4, 8]
  etc_weight:
    values: [1.0]
  etm_weight:
    values: [1.0]
  etg_weight:
    values: [0.25, 0.5, 1.0]
  etm_hard_neg_k:
    values: [1, 2, 3]
  focal_infonce:
    values: [true, false]
  focal_gamma_pos:
    values: [1.0, 1.5, 2.0]
  focal_gamma_neg:
    values: [0.0, 0.25, 0.5]
  focal_alpha_default:
    distribution: uniform
    min: 0.8
    max: 1.6
  validate_etg_fraction:
    values: [0.1, 0.2]
  name:
    values: ["ecg_text_stage1_medgemma1.5_sweep"]
  project:
    values: ["ecg_text_stage1_medgemma1.5"]
  entity:
    values: ["mhi_ai"]

early_terminate:
  type: hyperband
  min_iter: 3
  eta: 2
  s: 2

run_mode: train
use_wandb: true

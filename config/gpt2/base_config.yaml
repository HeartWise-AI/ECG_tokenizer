# pipeline project
pipeline_project: !!str "ECG_tokenizer_LLM_finetuning"
runner_name: !!str "LLM_finetuning_runner"
run_mode: !!str "train"
num_epochs: !!int 5
seed: !!int 42
base_checkpoint_path: !!str "checkpoints"
# wandb parameters
wandb_project: !!str "ECG_tokenizer_LLM_finetuning_MHI"
wandb_entity: !!str "mhi_ai"
use_wandb: !!bool true
# training parameters
num_workers: !!int 12
llm_lr: !!float 5e-5
llm_weight_decay: !!float 1e-4
embedding_reducer_lr: !!float 5e-5
embedding_reducer_weight_decay: !!float 1e-4
batch_size: !!int 32
criterion: !!str "focal_loss"
optimizer: !!str "AdamW"
scheduler_type: !!str "cosine_warm_restart"
step_size: !!int 1
gamma: !!float 0.1
num_warmup_percent: !!float 0.1
num_hard_restarts_cycles: !!float 1.0
warm_restart_tmult: !!int 2
# tokenizer parameters
tokenizer_name: !!str "gpt2"
max_token_length: !!int 512
# model parameters
huggingface_model_name: !!str "gpt2"
trainable_model_name: !!str "GPT2_WithEmbedding"
embedding_reducer_name: !!str "GPT2_LinearReducer"
gpt2_embedding_size: !!int 768
reducer_dropout: !!float 0.2
# metrics
metrics:
  - !!str "rouge"
  - !!str "bleu"
  - !!str "meteor"
# data parameters
# train_dataset_path: !!str "/media/data1/datasets/DeepECG/SSL_pretraining/split/MIMIC/mimic_v4_clean_train.parquet"
train_dataset_path: !!str "/media/data1/datasets/ECG_Tokenizer/parquets/train/mimic_mhi_psa_train_updated.parquet"
# validation_dataset_path: !!str "/media/data1/datasets/DeepECG/SSL_pretraining/split/MIMIC/mimic_v4_clean_val.parquet"
validation_dataset_path: !!str "/media/data1/datasets/ECG_Tokenizer/parquets/test/mimic_mhi_psa_test_updated.parquet"
train_embeddings_path: !!str "/volume/embeddings/QINCo_512_processed/train"
validation_embeddings_path: !!str "/volume/embeddings/QINCo_512_processed/test"
checkpoint_dir: !!str "/volume/ECG_tokenizer/checkpoints/ECG_tokenizer_LLM_finetuning/ECG_tokenizer_LLM_finetuning_MHI/uzln73wp_20250531-193014/checkpoint_epoch_5.pt"
# Inference parameters
inference_dataset_path: !!str "/media/data1/datasets/ECG_Tokenizer/parquets/test/mimic_mhi_psa_test_updated.parquet"
output_dir: !!str "/volume/ECG_tokenizer/output/mimic_mhi_gpt_inference"

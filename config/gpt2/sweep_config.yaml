command:
  - torchrun
  - "--nproc_per_node=4"
  - "--master_port=29500"
  - "scripts/main.py"
  - "--base_config"
  - "config/gpt2/base_config.yaml"
  - ${args}

name: "gpt2_mhi"
project: "ECG_tokenizer_LLM_finetuning_MHI"
entity: "mhi_ai"

method: bayes
metric:
  name: validate/loss
  goal: minimize

parameters:
  llm_lr:
    distribution: log_uniform_values
    min: 5e-5
    max: 1e-3

  embedding_reducer_lr:
    distribution: log_uniform_values
    min: 5e-5
    max: 1e-3

  reducer_dropout:
    distribution: uniform
    min: 0.0
    max: 0.7

  batch_size:
    values: [8, 16, 32, 64]

  optimizer:
    values: ["RAdam", "AdamW"]

  scheduler_type:
    values: ["step", "cosine"]   

  step_size:
    values: [1, 5, 10, 15, 20]

  llm_weight_decay:
    values: [0.0, 0.001, 0.01, 0.1]

  embedding_reducer_weight_decay:
    values: [0.0, 0.001, 0.01, 0.1]

  gamma:
    distribution: uniform
    min: 0.1
    max: 0.5

  max_token_length:
    values: [512]

  project:
    values: ["ECG_tokenizer_LLM_finetuning_MHI"]

  entity:
    values: ["mhi_ai"]

  name:
    values: ["gpt2_mhi"]

early_terminate:
  type: hyperband
  min_iter: 3
  eta: 2
  s: 2



  
command:
  - torchrun
  - "--nproc_per_node=4"
  - "--master_port=29500"
  - "scripts/main.py"
  - "--base_config"
  - "config/gpt2/base_config.yaml"
  - ${args}

name: "gpt2_half"
project: "ECG_tokenizer_LLM_finetuning"
entity: "jacques-delfrate"

method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  lr:
    distribution: log_uniform_values
    min: 5e-5
    max: 1e-3

  reducer_dropout:
    distribution: uniform
    min: 0.0
    max: 0.5

  batch_size:
    values: [8, 16, 32]

  optimizer:
    values: ["RAdam", "AdamW"]

  scheduler_type:
    values: ["step", "cosine"]   

  step_size:
    values: [1, 5, 10, 15, 20]     

  gamma:
    distribution: uniform
    min: 0.1
    max: 0.5

  max_token_length:
    values: [512]

  project:
    values: ["ECG_tokenizer_LLM_finetuning"]

  entity:
    values: ["jacques-delfrate"]

  name:
    values: ["gpt2_half"]

early_terminate:
  type: hyperband
  min_iter: 3
  eta: 2
  s: 2



  
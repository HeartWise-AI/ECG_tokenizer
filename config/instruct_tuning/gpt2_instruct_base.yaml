# GPT2 Instruction Tuning Configuration
project_name: "ECG_TOKENIZER_INSTRUCT_TUNING"
experiment_name: "gpt2_instruct_tuning"
run_name: "gpt2_instruct_ecg_qa"

# Pipeline parameters
pretrained_tokenizer_path: "/volume/ECG_tokenizer/checkpoints/best_tokenizer.ckpt"
model_name: "ECG_Tokenizer"
runner_name: "InstuctTuningRunner"
num_epochs: 3
base_checkpoint_path: "/volume/ECG_tokenizer/checkpoints/"

# Model parameters
huggingface_model_name: "gpt2"
llm_input_embedding_size: 768
decoder_name: "GPT2_Decoder"
adapter_name: "GPT2_LinearAdapter"

# ECG tokenizer configuration
encoder_name: "Conv_Encoder"
quantizer_name: "ECG_Tokenizer_Quantizer"
num_quantizers: 4
codebook_size: 1024
decoder_mode: "llm"

# Instruction tuning specific
template_style: "alpaca"  # Options: alpaca, vicuna, chat, medical
max_seq_length: 512
include_metadata: true
enhanced_prompt: true

# Dataset configuration
train_data_path: "/volume/ECG_tokenizer/test_ecg_qa_sample/train.json"
eval_data_path: "/volume/ECG_tokenizer/test_ecg_qa_sample/eval.json"
test_data_path: "/volume/ECG_tokenizer/test_ecg_qa_sample/test.json"

# Training hyperparameters
learning_rate: 2e-5
num_train_epochs: 3
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.1
weight_decay: 0.01
logging_steps: 10
eval_steps: 100
save_steps: 500

# Advanced training settings
fp16: true
gradient_checkpointing: true
dataloader_num_workers: 4
remove_unused_columns: false

# LoRA settings (for efficient fine-tuning)
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.1
lora_target_modules: ["c_attn", "c_proj", "c_fc"]

# Output and logging
output_dir: "./outputs/instruct_tuning/gpt2"
logging_dir: "./logs/instruct_tuning/gpt2"

# WandB configuration
use_wandb: true
wandb_project: "ecg_instruct_tuning"
wandb_entity: null

# Early stopping
use_early_stopping: true
early_stopping_patience: 3
early_stopping_threshold: 0.001

# Computation
device: "cuda"
use_ddp: false
num_workers: 4
pin_memory: true

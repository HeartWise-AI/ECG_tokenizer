# pipeline project
pipeline_project: !!str "ECG_Tokenizer_Training"
run_mode: !!str "train"
num_epochs: !!int 10
seed: !!int 42
base_checkpoint_path: !!str "checkpoints"
# wandb parameters
wandb_project: !!str "ECG_Tokenizer_Training"
wandb_entity: !!str "mhi_ai"
use_wandb: !!bool true
# training parameters
lr: !!float 3e-4
scheduler_type: !!str "cosine_warm_restart"
lr_step_period: !!int 1
factor: !!float 0.3
optimizer: !!str "AdamW"
weight_decay: !!float 1e-4
step_size: !!int 1
gamma: !!float 0.1
num_warmup_percent: !!float 0.1
num_hard_restarts_cycles: !!float 1.0
warm_restart_tmult: !!int 2
# VQVAE parameters
encoder_name: !!str "ECG_Tokenizer_Conv_Encoder"
quantizer_name: !!str "ECG_Tokenizer_Quantizer"
decoder_name: !!str "ECG_Tokenizer_Conv_Decoder"
num_quantizers: !!int 12
codebook_size: !!int 1024
# Dataset parameters
train_dataset_path: !!str "parquets/merged_datasets/train/mimic_mhi_code15_psa_train.parquet"
validation_dataset_path: !!str "parquets/merged_datasets/test/mimic_mhi_psa_test.parquet"
num_workers: !!int 36
batch_size: !!int 16
# waveform parameters
waveform_length: !!int 2500
num_leads: !!int 12
normalize_waveforms: !!bool False

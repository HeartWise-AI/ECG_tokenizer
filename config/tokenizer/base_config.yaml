# pipeline project
pipeline_project: !!str "ECG_Tokenizer_Training"
output_dir: !!str "checkpoints"
run_mode: !!str "train"
num_epochs: !!int 50
seed: !!int 42
# wandb parameters
wandb_project: !!str "ECG_Tokenizer_Training"
wandb_entity: !!str "mhi_ai"
use_wandb: !!bool true
# training parameters
lr: !!float 3e-4
scheduler_name: !!str "step"
lr_step_period: !!int 1
factor: !!float 0.3
optimizer: !!str "AdamW"
weight_decay: !!float 1e-4
step_size: !!int 1
gamma: !!float 0.1
use_amp: !!bool true
# VQVAE parameters
encoder_name: !!str "ECG_Tokenizer_Conv_Encoder"
quantizer_name: !!str "ECG_Tokenizer_Quantizer"
decoder_name: !!str "ECG_Tokenizer_Conv_Decoder"
num_quantizers: !!int 8
codebook_size: !!int 512
# Dataset parameters
train_dataset_path: !!str "parquets/mhi/train_trial_v1.1_with_report_path_exists.parquet"
validation_dataset_path: !!str "parquets/mhi/test_trial_v1.1_with_report_subset.parquet"
num_workers: !!int 12
batch_size: !!int 32
# waveform parameters
waveform_length: !!int 2500
num_leads: !!int 12
normalize_waveforms: !!bool true

# Example configuration for Mistral model finetuning
pipeline_project: "ECG_tokenizer_LLM_finetuning"

# Wandb configuration
wandb_project: "ecg_tokenizer_mistral_finetuning"
wandb_entity: "your_wandb_entity"
use_wandb: true

# Base configuration
base_config_path: "config/examples/mistral_llm_finetuning.yaml"

# Model configuration - Mistral specific
model_type: "mistral"
huggingface_model_name: "mistralai/Mistral-7B-v0.1"
trainable_model_name: "Mistral_WithEmbedding"
embedding_reducer_name: "Mistral_SimpleEmbeddingReducer"

# Training hyperparameters (adjusted for larger model)
seed: 42
llm_lr: 0.00005  # Lower learning rate for larger model
embedding_reducer_lr: 0.001
num_workers: 4
batch_size: 4    # Smaller batch size for larger model
llm_weight_decay: 0.01
embedding_reducer_weight_decay: 0.01
num_epochs: 5    # Fewer epochs for larger model
criterion: "CrossEntropyLoss"
optimizer: "AdamW"
runner_name: "LLMFinetuningRunner"
scheduler_type: "CosineAnnealingWarmRestarts"
step_size: 3
gamma: 0.1
run_mode: "train"
reducer_dropout: 0.1
num_warmup_percent: 0.15
num_hard_restarts_cycles: 1.0
warm_restart_tmult: 2

# Tokenizer configuration
tokenizer_name: "mistralai/Mistral-7B-v0.1"
max_token_length: 512

# Data paths
train_dataset_path: "data/train_ecg_reports.parquet"
validation_dataset_path: "data/val_ecg_reports.parquet"
train_embeddings_path: "embeddings/train_ecg_embeddings.npy"
validation_embeddings_path: "embeddings/val_ecg_embeddings.npy"
inference_dataset_path: "data/test_ecg_reports.parquet"

# Output paths
output_dir: "outputs/mistral_finetuning"
checkpoint_dir: "checkpoints/mistral_finetuning"
base_checkpoint_path: "checkpoints/mistral_finetuning/best_model.pt"

# Metrics
metrics: ["accuracy", "bleu", "rouge"]

# Model-specific embedding sizes (automatically managed)
mistral_embedding_size: 4096  # Mistral-7B hidden size

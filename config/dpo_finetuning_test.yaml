pipeline_project: "ECG_Tokenizer_DPO_Finetuning"
runner_name: "ECG_Tokenizer_DPO_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
run_mode: "train"
wandb_project: "ECG_tokenizer_DPO"
wandb_entity: "mhi_ai"
use_wandb: true
# Checkpoint to start from
pretrained_tokenizer_path: "checkpoints/BEST_LLM/e4dw86nh_20251220-232839_BEST_QFORMER_8CB/best_model.pt"
# DPO pairs JSONL - TEST SUBSET
train_pairs_path: "output/dpo_inference/dpo_test_subset_100.jsonl"
# Training - small test run
num_epochs: 1
batch_size: 2
lr: 2.0e-5
beta: 0.1
num_workers: 2
grad_accum_steps: 1
max_grad_norm: 1.0
precision: "bf16"
save_interval: 50
log_interval: 5
# Trainable subset
trainable: "lora" # lora, bridge, projection, all
# Output directory for test run
output_dir: "output/dpo_test_run"

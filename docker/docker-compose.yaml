version: '3.8'

# ECG Tokenizer Inference Pipeline Docker Compose
# Following DeepECG_Docker pattern for volume mounts and service configuration

services:
  ecg_tokenizer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ecg-tokenizer:latest
    container_name: ecg_tokenizer_pipeline
    
    # GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # Volume mounts following DeepECG_Docker pattern
    volumes:
      # Input parquet files
      - ./inputs:/app/inputs
      # Output results (JSON, CSV)
      - ./outputs:/app/outputs
      # Raw ECG signals (read-only)
      - ./ecg_signals:/app/ecg_signals:ro
      # Preprocessed signals
      - ./preprocessing:/app/preprocessing
      # Model checkpoints (read-only)
      - ./checkpoints:/app/checkpoints:ro
      # Configuration files (read-only)
      - ./config:/app/config:ro
    
    # Environment variables
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    
    # Command
    command: ["--mode", "full_run", "--input", "/app/inputs/data.parquet", "--output", "/app/outputs/results.json"]
    
    # Interactive mode
    stdin_open: true
    tty: true

  # CPU-only service variant
  ecg_tokenizer_cpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ecg-tokenizer:latest
    container_name: ecg_tokenizer_pipeline_cpu
    
    volumes:
      - ./inputs:/app/inputs
      - ./outputs:/app/outputs
      - ./ecg_signals:/app/ecg_signals:ro
      - ./preprocessing:/app/preprocessing
      - ./checkpoints:/app/checkpoints:ro
      - ./config:/app/config:ro
    
    environment:
      - PYTHONUNBUFFERED=1
    
    command: ["--mode", "full_run", "--device", "cpu", "--batch-size", "8"]
    
    stdin_open: true
    tty: true

# Volume definitions for named volumes (optional)
volumes:
  inputs:
  outputs:
  ecg_signals:
  preprocessing:
  checkpoints:
  config:

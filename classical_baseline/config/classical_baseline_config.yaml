data:
  expected_waveform_length: 2500
  normalize_waveforms: true
  num_leads: 12
  random_state: 42
  signal_path_column: waveform_path_psa
  test_size: 0.2
  validation_size: 0.1
machine_learning:
  classifiers:
    gradient_boosting:
      learning_rate: 0.1
      max_depth: 3
      n_estimators: 100
    logistic_regression:
      C: 1.0
      max_iter: 1000
      solver: lbfgs
    random_forest:
      max_depth: null
      min_samples_leaf: 1
      min_samples_split: 2
      n_estimators: 100
    svm:
      C: 1.0
      gamma: scale
      kernel: rbf
  cv_folds: 5
  n_jobs: -1
output:
  output_dir: /volume/ECG_tokenizer/classical_baseline/output
  save_features: true
  save_models: true
  save_predictions: true
signal_processing:
  emd:
    max_imf: 8
  sax:
    alphabet_size: 26
    bow_n_bins: 10
    bow_window_size: 12
    bow_word_size: 4
    n_segments: 20
  vmd:
    DC: 0
    K: 8
    alpha: 2000
    init: 1
    tau: 0
    tol: 1.0e-07
  wavelet:
    levels: 6
    name: db4

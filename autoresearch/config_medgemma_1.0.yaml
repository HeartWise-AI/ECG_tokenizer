# MedGemma 1.0 (4b-it) — Full training config for autoresearch
# Bridge: e4dw86nh champion (10 Q-Former layers, 12 heads, j4bb0w33 stage-1)
# Resume from: e4dw86nh best_model.pt (best checkpoint from prior training)

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "train"
num_epochs: 1
seed: 42
# Training phases configuration — skip phase 1, bridge already aligned
training_phases:
  phase1_alignment:
    epochs: 0
    freeze_llm: true
    use_lora: true
    llm_lr: 5.0e-5
    ecg_embedding_lr: 0.0
    adapter_lr: 5.0e-4
    cross_attention_lr: 5.0e-4
    warmup_steps: 2000
    debug_config:
      log_gradient_norms: true
debug_config:
  log_gradient_norms: true
  show_sample_outputs: false
  log_frequency: 50
base_checkpoint_path: "checkpoints"
pretrained_tokenizer_path: !!str "/media/data1/models/ECG_Tokenizer/ECG_Tokenizer_Reconstruction/tfq5q94l_20250622-004552/best_model_epoch_10.pt"
# Fresh start — no resume, using stage-1 bridge + pretrained MedGemma
resume_checkpoint_path: null
wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
# --- AUTORESEARCH OVERRIDES ---
use_wandb: false
max_train_steps: 100
# --- END AUTORESEARCH OVERRIDES ---
# Optimizer & scheduler
llm_lr: 4.0e-4
adapter_lr: 2.0e-3
llm_weight_decay: 1.0e-5
adapter_weight_decay: 1.0e-4
scheduler_type: "cosine_with_warmup"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.05
num_hard_restarts_cycles: 0.5
warm_restart_tmult: 2
# Stage-1: j4bb0w33 (aligned with MedGemma 4b-it)
stage1_checkpoint_path: "checkpoints/ECG_Text_Stage1/ecg_text_stage1/BEST_QFORMER_MEDGEMMA_j4bb0w33_20251113-141927/checkpoints/stage1_last_epoch_010.pt"
decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
# Model: MedGemma 4B-IT (1.0)
tokenizer_name: "google/medgemma-4b-it"
huggingface_model_name: "google/medgemma-4b-it"
use_auto_processor: false
max_token_length: 640
num_ecg_tokens: 0
instruct_mode: true
prefix_tuning: false
medgemma_prompt_style: true
# Bridge: e4dw86nh champion (10 layers, 12 heads)
bridge_name: "InstructionAwareECGQFormerBridge"
bridge_mid_dim: 768
bridge_num_heads: 12
bridge_dropout: 0.0
bridge_num_special_tokens: 4
num_query_tokens: 32
bridge_qformer_layers: 10
bridge_text_hidden_size: 768
bridge_bias_last_codebook: 0.5
bridge_codebook_dropout: 0.05
bridge_cross_every: 2
instruction_dropout: 0.05
use_cross_attention: false
num_attention_heads: 8
intermediate_dim: 1024
# Codebook selection (j4bb0w33)
num_codebooks_kept: 8
codebook_offset: -1
num_quantizers: 8
ecg_codebook_size: 512
llm_input_embedding_size: 2560
# LoRA configuration
use_lora: true
lora_r: 96
lora_alpha: 192
lora_dropout: 0.0
lora_top_k_layers: 24
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_bias: "none"
# Multi-dataset: balanced QA + SFT tasks (HCM, symptom, potassium)
# Weights chosen to equalize effective samples across datasets
train_dataset_paths:
  - "/volume/ECG_tokenizer/output/balanced_train_400k.parquet"
  - "/volume/ECG_tokenizer/output/sft_hcm_train.parquet"
  - "/volume/ECG_tokenizer/output/sft_symptom_train.parquet"
  - "/volume/ECG_tokenizer/output/sft_potassium_train.parquet"
dataset_weights: [1.0, 1.0, 1.0, 1.0]
validation_dataset_paths:
  - "/volume/ECG_tokenizer/output/combined_test_qa_m25k_h25k.parquet"
  - "/volume/ECG_tokenizer/output/sft_hcm_test.parquet"
  - "/volume/ECG_tokenizer/output/sft_symptom_test.parquet"
  - "/volume/ECG_tokenizer/output/sft_potassium_test.parquet"
# Single-dataset fallback (not used when train_dataset_paths is set)
train_dataset_path: "/volume/ECG_tokenizer/output/balanced_train_400k.parquet"
validation_dataset_path: "/volume/ECG_tokenizer/output/combined_test_qa_m25k_h25k.parquet"
prompt_column: "prompt"
answer_column: "generated_answer"
category_column: "prompt_category"
# No pattern columns (SFT datasets don't have them)
pattern_label_columns: []
num_workers: 24
batch_size: 16
signal_path_column: "waveform_path_psa"
ecg_waveform_length: 2500
ecg_num_leads: 12
metrics:
  - "rouge"
  - "bleu"
  - "meteor"
  - "bertscore"
  - "json_parse_rate"
  - "structured_f1"
# --- AUTORESEARCH OVERRIDES ---
bertscore_max_batches: 5
plot_validation_ecgs: false
validation_step_interval: 80
validation_max_batches: 20
# --- END AUTORESEARCH OVERRIDES ---
compute_category_metrics: true
category_metrics:
  - "rouge"
  - "bleu"
  - "meteor"
pattern_loss_weight: 0
pattern_bce_pos_weight: 1.0
gradient_accumulation_steps: 8
dataloader_pin_memory: true
max_sequence_length: 768
validation_snapshot_batches: 20
validation_snapshot_prefix: "step"
validation_subset_size: 2000
validation_balance_prompt_categories: true
validation_sampling_seed: 42
train_metric_interval: 1000
train_metric_batches: 10
enable_attention_visualization: false
attention_log_frequency: 200
num_validation_plots: 6
plot_selection_strategy: "worst_random_best"
default_generation_kwargs:
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  no_repeat_ngram_size: 3
  max_new_tokens: 96
  min_new_tokens: 0
  repetition_penalty: 1.20
  force_json: false
  min_tokens_guard: 12
use_cf_eval: false
cf_eval_dataset_path: "ecg_cf_eval/test_cf.json"
cf_eval_interval: 500
cf_eval_samples: 1000

# LVEF long run inference — step 1500 checkpoint
# Checkpoint: v93n471z step 1500 (lvef_loss_weight=0.2, 2000 steps)

pipeline_project: "ECG_Tokenizer_LLM_Finetuning"
model_name: "ECG_Tokenizer_Wrapper"
runner_name: "ECG_Tokenizer_LLM_Finetuning"
run_mode: "inference"
num_epochs: 1
seed: 42

training_phases:
  phase1_alignment:
    epochs: 0
    freeze_llm: true
    use_lora: true
    llm_lr: 5.0e-5
    ecg_embedding_lr: 0.0
    adapter_lr: 5.0e-4
    cross_attention_lr: 5.0e-4
    warmup_steps: 2000
    debug_config:
      log_gradient_norms: false

debug_config:
  log_gradient_norms: false
  show_sample_outputs: false
  log_frequency: 50

base_checkpoint_path: "checkpoints"
pretrained_tokenizer_path: !!str "checkpoints/ECG_Tokenizer_LLM_Finetuning/ECG_tokenizer_MedGemma/ssn24jkm_20260315-114610/best_model.pt"
resume_checkpoint_path: "checkpoints/ECG_Tokenizer_LLM_Finetuning/ECG_tokenizer_MedGemma/v93n471z_20260323-201700/checkpoint_step_1500.pt"
wandb_project: "ECG_tokenizer_MedGemma"
wandb_entity: "mhi_ai"
use_wandb: false

llm_lr: 5.0e-5
adapter_lr: 5.0e-4
llm_weight_decay: 1.0e-5
adapter_weight_decay: 1.0e-5
scheduler_type: "cosine_with_warmup"
lr_step_period: 1
factor: 0.5
optimizer: "AdamW"
step_size: 1
gamma: 0.8
num_warmup_percent: 0.256
num_hard_restarts_cycles: 0.5
warm_restart_tmult: 2

stage1_checkpoint_path: "checkpoints/ECG_Text_Stage1/ecg_text_stage1/BEST_QFORMER_MEDGEMMA_j4bb0w33_20251113-141927/checkpoints/stage1_last_epoch_010.pt"

decoder_mode: "llm"
decoder_name: "MedGemma_Decoder"
tokenizer_name: "google/medgemma-4b-it"
use_auto_processor: false
max_token_length: 640
num_ecg_tokens: 0
instruct_mode: true
prefix_tuning: false
huggingface_model_name: "google/medgemma-4b-it"
medgemma_prompt_style: true

bridge_name: "InstructionAwareECGQFormerBridge"
bridge_mid_dim: 768
bridge_num_heads: 12
bridge_dropout: 0.0
bridge_num_special_tokens: 4
num_query_tokens: 32
bridge_qformer_layers: 10
bridge_text_hidden_size: 768
bridge_bias_last_codebook: 0.5
bridge_codebook_dropout: 0.05
bridge_cross_every: 2
instruction_dropout: 0.05
use_cross_attention: false
num_attention_heads: 8
intermediate_dim: 1024

num_codebooks_kept: 8
codebook_offset: -1
num_quantizers: 8
ecg_codebook_size: 512
llm_input_embedding_size: 2560

use_lora: true
lora_r: 96
lora_alpha: 192
lora_dropout: 0.0
lora_top_k_layers: 24
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_bias: "none"

train_dataset_path: "/volume/ECG_tokenizer/output/combined_train_qa_m5000k_h5000k_weighted.parquet"
use_weighted_sampling: true
sample_weight_column: "sample_weight"
validation_dataset_path: "/volume/ECG_tokenizer/output/test_100_sample.parquet"
prompt_column: "prompt"
answer_column: "generated_answer"
category_column: "prompt_category"

pattern_label_columns:
  - "Sinusal"
  - "Regular"
  - "Monomorph"
  - "QS complex in V1-V2-V3"
  - "R complex in V5-V6"
  - "T wave inversion (inferior - II, III, aVF)"
  - "Left bundle branch block"
  - "RaVL > 11 mm"
  - "SV1 + RV5 or RV6 > 35 mm"
  - "T wave inversion (lateral -I, aVL, V5-V6)"
  - "T wave inversion (anterior - V3-V4)"
  - "Left axis deviation"
  - "Left ventricular hypertrophy"
  - "Bradycardia"
  - "Q wave (inferior - II, III, aVF)"
  - "Afib"
  - "Irregularly irregular"
  - "Atrial tachycardia (>= 100 BPM)"
  - "Nonspecific intraventricular conduction delay"
  - "Premature ventricular complex"
  - "Polymorph"
  - "T wave inversion (septal- V1-V2)"
  - "Right bundle branch block"
  - "Ventricular paced"
  - "ST elevation (anterior - V3-V4)"
  - "ST elevation (septal - V1-V2)"
  - "1st degree AV block"

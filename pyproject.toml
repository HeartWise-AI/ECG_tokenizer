[project]
name = "ecg-tokenizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evaluate>=0.4.3",
    "bert-score>=0.3.13",
    "fastparquet>=2024.11.0",
    "iterative-stratification>=0.1.9",
    "matplotlib>=3.9.2",
    "pandas>=2.2.3",
    "peft>=0.7.0",
    "pyarrow>=19.0.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.5.2",
    "torch>=2.4.1",
    "torchvision>=0.19.1",
    "tqdm>=4.66.5",
    "transformers>=4.46.2",
    "vector-quantize-pytorch>=1.21.8",
    "wandb>=0.18.3",
    "xmltodict>=0.12.0",
    "pywavelets>=1.1.0",
]

[tool.setuptools]
packages = [
    "data",
    "models",
    "config",
    "runners",
    "projects",
    "utils/config"
]

[tool.pyright]
exclude = [
    ".venv/**",
    "**/.venv/**",
    ".pytest_cache/**",
    "**/__pycache__/**",
    ".git/**",
    "wandb/**",
    "checkpoints/**",
    "outputs/**",
    "logs/**",
    "*.egg-info/**"
]
ignore = [
    ".venv",
    "wandb",
    "checkpoints", 
    "outputs"
]
pythonVersion = "3.12"
typeCheckingMode = "basic"

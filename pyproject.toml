[project]
name = "ecg-tokenizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evaluate>=0.4.3",
    "bert-score>=0.3.13",
    "fastparquet>=2024.11.0",
    "iterative-stratification>=0.1.9",
    "matplotlib>=3.9.2",
    "nltk>=3.9.1",
    "pandas==2.2.3",
    "peft==0.17.1",
    "pyarrow>=19.0.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.5.2",
    "statsmodels>=0.14.5",
    "sentencepiece>=0.2.0",
    "torch==2.6.0+cu124",
    "torchvision>=0.21.0",
    "tqdm>=4.66.5",
    "transformers>=5.3.0",
    "tokenizers>=0.21.0",
    "vector-quantize-pytorch==1.24.2",
    "wandb>=0.18.3",
    "wfdb==4.1.2",
    "yq>=3.1.0",
    "xmltodict>=0.12.0",
    "pywavelets>=1.1.0",
    "sacrebleu>=2.5.1",
]

[tool.setuptools]
packages = [
    "data",
    "models",
    "config",
    "runners",
    "projects",
    "utils/config"
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pyright]
exclude = [
    ".venv/**",
    "**/.venv/**",
    ".pytest_cache/**",
    "**/__pycache__/**",
    ".git/**",
    "wandb/**",
    "checkpoints/**",
    "outputs/**",
    "logs/**",
    "*.egg-info/**"
]
ignore = [
    ".venv",
    "wandb",
    "checkpoints", 
    "outputs"
]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
